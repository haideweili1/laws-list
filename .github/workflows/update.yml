name: 法律法规清单自动更新

on:
  # 每周一 01:00 UTC = 北京时间 09:00 自动跑（草稿模式：只出提案，不自动改清单）
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch: {}   # 允许在 Actions 页面手动点「Run workflow」立即执行

permissions:
  contents: write        # 需要写权限以便提交更新后的 data.json

concurrency:
  group: laws-list-retrieval
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt sniffio
          python -c "import zhipuai; print('zhipuai 已安装:', zhipuai.__version__)"

      - name: 联网检索并更新法规/标准
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SYNC_PROXY: ${{ secrets.SYNC_PROXY }}
          # 【不再从仓库变量传 MODEL】以前 vars.MODEL 若残留 glm-4-air，
          # 会悄悄把脚本里升级好的 glm-4-plus 顶掉。模型统一在 update_laws_action.py 内指定。
        run: python update_laws_action.py

      - name: 提交变更（脚本已提交则跳过；作为兜底）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 草稿模式下产出的是 proposed-changes.json / proposed-data.json；用 -A 一并兜底提交
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "自动更新法律法规清单 $(date +%F)"
            # 推送前先拉取并合并（merge，非 rebase），避免与网页手动编辑/同步流程的提交冲突导致 non-fast-forward 失败
            git pull --no-rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main || echo "pull skipped (无新提交或无需合并)"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          fi
