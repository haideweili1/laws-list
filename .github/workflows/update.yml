name: 法律法规清单自动更新

on:
  schedule:
    # 每周一 01:00 UTC = 北京时间 09:00
    - cron: '0 1 * * 1'
  workflow_dispatch: {}   # 允许在 Actions 页面手动点「Run workflow」立即执行

permissions:
  contents: write        # 需要写权限以便提交更新后的 laws.json

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 联网检索并更新法规
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ vars.MODEL }}
        run: python update_laws_action.py

      - name: 提交变更（若有）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add laws.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "自动更新法律法规清单 $(date +%F)"
            git push
          fi
