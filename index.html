<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法律法规与产品标准清单</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --line:#e3e8ef; --text:#1f2733; --muted:#6b7785;
    --pri:#2563eb; --pri-d:#1d4ed8; --ok:#16a34a; --warn:#ea580c; --bad:#dc2626; --gray:#94a3b8;
    --tag:#eef2ff; --tag-t:#4338ca;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Microsoft YaHei",Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  header{background:linear-gradient(90deg,#1e3a8a,#2563eb);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .meta{font-size:12px;opacity:.85}
  .top-tabs{display:flex;gap:4px;padding:10px 22px 0;background:var(--card);border-bottom:1px solid var(--line)}
  .top-tabs button{border:none;background:none;padding:10px 18px;font-size:15px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:600}
  .top-tabs button.active{color:var(--pri);border-bottom-color:var(--pri)}
  .sub-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 22px;background:var(--card)}
  .sub-tabs button{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:16px;cursor:pointer;color:var(--muted);font-size:13px}
  .sub-tabs button.active{background:var(--pri);color:#fff;border-color:var(--pri)}
  .toolbar{display:flex;gap:10px;align-items:center;padding:10px 22px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line)}
  .toolbar input[type=search]{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text)}
  .btn:hover{background:#f0f4ff}
  .btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
  .btn.pri:hover{background:var(--pri-d)}
  .wrap{padding:0 22px 40px;background:var(--card)}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:#f1f5f9;position:relative;white-space:nowrap}
  th .fbtn{cursor:pointer;color:var(--pri);margin-left:4px;font-size:11px;user-select:none}
  tbody tr:nth-child(even){background:#fafbfc}
  tbody tr:hover{background:#eff6ff}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
  .badge.ok{background:#dcfce7;color:var(--ok)}
  .badge.warn{background:#ffedd5;color:var(--warn)}
  .badge.bad{background:#fee2e2;color:var(--bad)}
  .badge.gray{background:#e2e8f0;color:var(--gray)}
  .tag{display:inline-block;background:var(--tag);color:var(--tag-t);padding:1px 7px;border-radius:8px;font-size:11px;margin:1px 2px}
  a.link{color:var(--pri);text-decoration:none}
  a.link:hover{text-decoration:underline}
  .cnt{color:var(--muted);font-size:12px;margin-left:auto}
  .filter-pop{position:absolute;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:8px;z-index:50;min-width:160px;max-height:260px;overflow:auto;display:none}
  .filter-pop label{display:block;padding:4px 6px;cursor:pointer;font-size:13px;white-space:nowrap}
  .filter-pop .fp-actions{display:flex;gap:6px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
  .modal{background:#fff;border-radius:12px;padding:20px;width:520px;max-width:92vw;max-height:90vh;overflow:auto;position:relative}
  .modal h3{margin:0 0 14px}
  .close-x{position:absolute;top:12px;right:14px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;user-select:none}
  .close-x:hover{background:#f1f5f9;color:var(--text)}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .modal input,.modal select,.modal textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
  .modal .row{display:flex;gap:10px}
  .modal .row>div{flex:1}
  .modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gray);margin-right:6px}
  .dot.synced{background:var(--ok)} .dot.err{background:var(--bad)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2733;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.3s;z-index:200}
  .toast.show{opacity:1}
  .manual{background:#faf5ff} .modified{background:#fff7ed}
  .hidden{display:none!important}
.head-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn .ico{display:inline-block;width:14px;text-align:center}
.btn.loading{position:relative}
.btn.loading .ico::after{content:"";display:inline-block;width:10px;height:10px;border:2px solid #cbd5e1;border-top-color:var(--pri);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.err{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.7;cursor:default}
.change-card{margin:10px 22px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.cc-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:6px}
.cc-body .cri{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px;border-bottom:1px dashed #eef}
.cc-body .cri:last-child{border-bottom:none}
.ct{display:inline-block;padding:1px 7px;border-radius:8px;font-size:11px}
.ct.manual{background:#ede9fe;color:#6d28d9}
.ct.auto{background:#dcfce7;color:#15803d}
.ct-time{color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.cl-entry{border-bottom:1px solid var(--line);padding:8px 0}
.cl-entry:last-child{border-bottom:none}
.cl-meta{color:var(--muted);font-size:12px;margin-bottom:2px}
.cl-entry ul{margin:4px 0 0;padding-left:18px}
.old{color:var(--bad)} .new{color:var(--ok)}
.batchbar{display:flex;gap:10px;align-items:center;padding:8px 22px;background:#eff6ff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.batchbar.hidden{display:none}
.batchbar .btn[disabled]{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<header>
  <h1>法律法规与产品标准清单</h1>
  <div class="meta">数据更新时间：<span id="lastUpdated">-</span> ｜ <span class="dot" id="syncDot"></span><span id="syncText">本地</span></div>
  <div class="head-actions">
    <button class="btn" id="syncBtn" onclick="manualSync()"><span class="ico"></span>同步</button>
    <button class="btn" id="retrieveBtn" onclick="triggerRetrieve()"><span class="ico"></span>自动检索</button>
  </div>
</header>

<div class="top-tabs">
  <button id="tab-laws" class="active" onclick="switchTop('laws')">法律法规</button>
  <button id="tab-standards" onclick="switchTop('standards')">产品标准</button>
</div>

<!-- 最近变更预览卡 -->
<div class="change-card">
  <div class="cc-head"><span>最近变更</span><button class="btn sm" onclick="openChangelog()">查看详细记录</button></div>
  <div id="changePreview" class="cc-body"><span class="muted">暂无变更记录</span></div>
</div>

<!-- 法律法规视图 -->
<section id="view-laws">
  <div class="sub-tabs" id="lawSubTabs"></div>
  <div class="toolbar">
    <input type="search" id="lawSearch" placeholder="搜索法规名称/发文字号/部门/备注…" oninput="onSearch('laws',this.value)">
    <button class="btn pri" onclick="openEdit('laws')">+ 新增法规</button>
    <button class="btn" onclick="exportExcel('laws')">导出Excel</button>
    <button class="btn" onclick="exportPDF('laws')">导出PDF</button>
    <button class="btn" onclick="exportPNG('laws')">导出图片</button>
    <span class="cnt" id="lawCnt"></span>
  </div>
  <div class="batchbar hidden" id="batchBar-laws">
    <span id="batchInfo-laws"></span>
    <button class="btn pri sm" onclick="batchDelete('laws')">批量删除</button>
    <button class="btn sm" onclick="openBatchStatus('laws')">批量改状态</button>
    <button class="btn sm" onclick="openBatchDomain('laws')">批量设领域</button>
  </div>
  <div class="wrap">
    <table id="lawTable">
      <thead><tr>
        <th>序号</th><th>法规名称</th><th>发文字号</th><th>发布部门</th><th>实施日期</th>
        <th>状态<span class="fbtn" data-f="status">▾筛选</span></th>
        <th>所属领域<span class="fbtn" data-f="domains">▾筛选</span></th>
        <th>原文链接</th><th>备注</th><th>操作<br><input type="checkbox" id="selAllLaws" onclick="toggleSelAll('laws',this.checked)"></th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<!-- 产品标准视图 -->
<section id="view-standards" class="hidden">
  <div class="toolbar">
    <input type="search" id="stdSearch" placeholder="搜索标准名称/编号/类型/发布单位/备注…" oninput="onSearch('standards',this.value)">
    <button class="btn pri" onclick="openEdit('standards')">+ 新增标准</button>
    <button class="btn" onclick="exportExcel('standards')">导出Excel</button>
    <button class="btn" onclick="exportPDF('standards')">导出PDF</button>
    <button class="btn" onclick="exportPNG('standards')">导出图片</button>
    <span class="cnt" id="stdCnt"></span>
  </div>
  <div class="batchbar hidden" id="batchBar-standards">
    <span id="batchInfo-standards"></span>
    <button class="btn pri sm" onclick="batchDelete('standards')">批量删除</button>
    <button class="btn sm" onclick="openBatchStatus('standards')">批量改状态</button>
  </div>
  <div class="wrap">
    <table id="stdTable">
      <thead><tr>
        <th>序号</th><th>标准编号</th><th>标准名称</th>
        <th>标准类型<span class="fbtn" data-f="stdType">▾筛选</span></th>
        <th>发布单位</th><th>实施日期</th>
        <th>状态<span class="fbtn" data-f="status">▾筛选</span></th>
        <th>原文链接</th><th>备注</th><th>操作<br><input type="checkbox" id="selAllStds" onclick="toggleSelAll('standards',this.checked)"></th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<!-- 筛选弹层容器 -->
<div id="filterLayer"></div>

<!-- 编辑弹窗 -->
<div class="modal-mask" id="editMask" onclick="if(event.target===this)closeEdit()">
  <div class="modal">
    <span class="close-x" onclick="closeEdit()" title="关闭">✕</span>
    <h3 id="editTitle">编辑</h3>
    <input type="hidden" id="eTable"><input type="hidden" id="eId">
    <div class="row">
      <div><label id="lblName">法规名称 *</label><input id="eName"></div>
      <div><label id="lblNo">发文字号</label><input id="eNo"></div>
    </div>
    <div class="row">
      <div><label id="lblDept">发布部门</label><input id="eDept"></div>
      <div><label>实施日期</label><input id="eDate" placeholder="YYYY-MM-DD"></div>
    </div>
    <div class="row">
      <div><label>状态</label>
        <select id="eStatus"><option>现行有效</option><option>即将实施</option><option>已废止</option></select>
      </div>
      <div><label id="lblType">标准类型</label>
        <select id="eType">
          <option>国家标准</option><option>国际标准</option><option>欧盟标准</option><option>美国FDA</option>
          <option>法国法令</option><option>法国食品级法规通告</option><option>德国LFGB</option><option>德国标准</option>
          <option>意大利标准</option><option>SVHC</option><option>美国加州</option><option>巴西497法令</option><option>行业标准</option><option>其他</option>
        </select>
      </div>
    </div>
    <label>废止日期（可选，填了到期后自动转为「已废止」）</label>
    <input id="eAbolish" placeholder="YYYY-MM-DD，留空表示暂无废止计划">
    <label>所属领域（多选，逗号分隔）</label>
    <input id="eDomains" placeholder="质量,环境,职业健康安全,信息安全,社会责任,反恐">
    <label>原文链接</label><input id="eLink" placeholder="https://">
    <label>备注</label><textarea id="eRemark" rows="3"></textarea>
    <div class="acts">
      <button class="btn" onclick="closeEdit()">取消</button>
      <button class="btn pri" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 批量改状态弹窗 -->
<div class="modal-mask" id="batchStatusMask" onclick="if(event.target===this)closeBatchStatus()">
  <div class="modal">
    <span class="close-x" onclick="closeBatchStatus()" title="关闭">✕</span>
    <h3>批量改状态</h3>
    <p class="muted" id="batchStatusInfo"></p>
    <label>选择状态</label>
    <select id="bStatus"><option>现行有效</option><option>即将实施</option><option>已废止</option></select>
    <div class="acts"><button class="btn" onclick="closeBatchStatus()">取消</button><button class="btn pri" onclick="applyBatchStatus()">应用</button></div>
  </div>
</div>

<!-- 批量设领域弹窗 -->
<div class="modal-mask" id="batchDomainMask" onclick="if(event.target===this)closeBatchDomain()">
  <div class="modal">
    <span class="close-x" onclick="closeBatchDomain()" title="关闭">✕</span>
    <h3>批量设领域</h3>
    <p class="muted" id="batchDomainInfo"></p>
    <label>所属领域（多选，逗号分隔）</label>
    <input id="bDomain" placeholder="质量,环境,职业健康安全,信息安全,社会责任,反恐">
    <div class="acts"><button class="btn" onclick="closeBatchDomain()">取消</button><button class="btn pri" onclick="applyBatchDomain()">应用</button></div>
  </div>
</div>

<!-- 变更记录弹窗 -->
<div class="modal-mask" id="clogMask" onclick="if(event.target===this)closeChangelog()">
  <div class="modal">
    <span class="close-x" onclick="closeChangelog()" title="关闭">✕</span>
    <h3>变更记录</h3>
    <div id="clogBody" style="max-height:60vh;overflow:auto"></div>
    <div class="acts"><button class="btn pri" onclick="closeChangelog()">关闭</button></div>
  </div>
</div>



<script>
const SYNC_PROXY = "https://1460512300-c9zrn53ghd.ap-guangzhou.tencentscf.com";
const LS_OVR="lawOverrides_v3", LS_DEL="deletedLaws_v3", LS_MAN="manualLaws_v3", LS_LOG="changeLog_v1";
let DATA={laws:[],standards:[],lastUpdated:""};
let edits={overrides:{},deleted:[],manual:[],log:[]};
let selected=new Set();
const state={top:"laws",lawSub:"全部",
  filters:{laws:{status:new Set(),domains:new Set()},standards:{stdType:new Set(),status:new Set()}},
  search:{laws:"",standards:""}};

/* ---------- 工具 ---------- */
function $(s){return document.querySelector(s)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function loadLS(k){try{const _v=localStorage.getItem(k);return _v?JSON.parse(_v):null}catch(e){return null}}
function saveLS(k,v){localStorage.setItem(k,JSON.stringify(v))}
function keyOf(table,id){return table+"::"+id}
function statusBadge(s){const m={"现行有效":"ok","即将实施":"warn","已废止":"bad"};const c=m[s]||"gray";return `<span class="badge ${c}">${s||"-"}</span>`}
function domainsTags(arr){return (arr||[]).map(d=>`<span class="tag">${d}</span>`).join("")}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- 数据加载与合并 ---------- */
async function init(){
  // 单文件加载：直接 fetch data.json（数据已瘦身；此前“截断”是误判，真凶是代码 bug 已修复）
  DATA={laws:[],standards:[],lastUpdated:""};
  try{
    const r=await fetch("data.json?t="+Date.now());
    if(r.ok){ const d=await r.json(); if(d&&(d.laws||d.standards))DATA=d; }
  }catch(e){ console.error("加载 data.json 失败",e); }
  $("#lastUpdated").textContent=DATA.lastUpdated||"-";
  // 本地编辑
  edits.overrides=loadLS(LS_OVR)||{}; edits.deleted=loadLS(LS_DEL)||[]; edits.manual=loadLS(LS_MAN)||[];
  // 变更记录：丢弃旧版格式的残留记录（早期版本只记了时间，没有法规名和改动详情，显示为空的《》）
  const _rawLog=loadLS(LS_LOG)||[];
  edits.log=_rawLog.filter(e=>e&&e.op&&e.name&&e.ts);
  if(edits.log.length!==_rawLog.length) saveLS(LS_LOG,edits.log);
  // 云端合并（best-effort）
  await loadCloud();
  renderChangePreview();
  // 子分类Tab
  const subs=["全部","质量","环境与职业健康","信息安全","反恐"];
  $("#lawSubTabs").innerHTML=subs.map(s=>`<button class="${s==='全部'?'active':''}" data-s="${s}" onclick="switchSub('${s}')">${s}</button>`).join("");
  buildFilterOptions();
  renderLaws();renderStandards();
  // 多人协同：每45秒自动从云端拉取同事修改（只读静态文件，不调 SCF、不收费）；切回窗口立即拉取
  if(!window.__cloudTimer){
    window.__cloudTimer=setInterval(cloudPull,45000);
    window.addEventListener("focus",cloudPull);
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") cloudPull(); });
  }
}
function getMerged(table){
  const base=table==="laws"?DATA.laws:DATA.standards;
  const prefix=table+"::";
  let arr=base.map(r=>({...r}));
  // 覆盖
  for(const k in edits.overrides){ if(k.startsWith(prefix)){const id=k.slice(prefix.length);const rec=arr.find(x=>x.id===id);if(rec)Object.assign(rec,edits.overrides[k]);} }
  // 删除
  const del=new Set((Array.isArray(edits.deleted)?edits.deleted:[]).filter(k=>k.startsWith(prefix)).map(k=>k.slice(prefix.length)));
  arr=arr.filter(r=>!del.has(r.id));
  // 手动新增
  for(const m of edits.manual){ if(m.table===table) arr.push({...m}); }
  return arr;
}

/* ---------- 法律法规渲染 ---------- */
const LAW_COLS=["name","docNumber","dept","effectiveDate","status","domains","link","remark"];
function renderLaws(){
  let arr=getMerged("laws");
  if(state.lawSub!=="全部") arr=arr.filter(r=>r.category===state.lawSub);
  const f=state.filters.laws, q=state.search.laws.trim().toLowerCase();
  if(f.status.size) arr=arr.filter(r=>f.status.has(r.status));
  if(f.domains.size) arr=arr.filter(r=>(r.domains||[]).some(d=>f.domains.has(d)));
  if(q) arr=arr.filter(r=>LAW_COLS.some(c=>String(r[c]||"").toLowerCase().includes(q)));
  const tb=$("#lawTable tbody"); tb.innerHTML=arr.map((r,i)=>{
    const manual=edits.manual.some(m=>m.table==="laws"&&m.id===r.id);
    const cls=manual?"manual":(edits.overrides[keyOf("laws",r.id)]?"modified":"");
    return `<tr class="${cls}">
      <td>${i+1}</td><td>${esc(r.name)}</td><td>${esc(r.docNumber)}</td><td>${esc(r.dept)}</td><td>${esc(r.effectiveDate)}</td>
      <td>${statusBadge(r.status)}</td><td>${domainsTags(r.domains)}</td>
      <td>${r.link?`<a class="link" href="${esc(r.link)}" target="_blank">查看</a>`:"-"}</td>
      <td>${esc(r.remark)}</td>
      <td><input type="checkbox" class="sel" data-k="${keyOf('laws',r.id)}" ${selected.has(keyOf('laws',r.id))?'checked':''} onchange="onRowCheck(this)"> <a class="link" onclick="openEdit('laws','${r.id}')">改</a> <a class="link" onclick="delRec('laws','${r.id}')">删</a></td>
    </tr>`;
  }).join("");
  $("#lawCnt").textContent=`共 ${arr.length} 条`;
  renderBatchBar("laws");
}
const STD_COLS=["stdNo","name","stdType","publisher","effectiveDate","status","link","remark"];
function renderStandards(){
  let arr=getMerged("standards");
  const f=state.filters.standards, q=state.search.standards.trim().toLowerCase();

function closeEdit(){$("#editMask").style.display="none"}
function saveEdit(){
  const table=$("#eTable").value, id=$("#eId").value, name=$("#eName").value.trim();
  if(!name){toast("名称必填");return;}
  const oldRec=id?getMerged(table).find(r=>r.id===id):null;
  const rec={
    name:name,
    docNumber:table==="laws"?$("#eNo").value.trim():"",
    stdNo:table==="standards"?$("#eNo").value.trim():"",
    dept:table==="laws"?$("#eDept").value.trim():"",
    publisher:table==="standards"?$("#eDept").value.trim():"",
    effectiveDate:$("#eDate").value.trim(),
    status:$("#eStatus").value,
    stdType:table==="standards"?$("#eType").value:"",
    domains:table==="laws"?$("#eDomains").value.split(",").map(s=>s.trim()).filter(Boolean):[],
    link:$("#eLink").value.trim(),
    remark:$("#eRemark").value.trim(),
    abolishDate:$("#eAbolish").value.trim(),
    region:name.includes("广东")?"广东":""
  };
  let op, diff=null, logName=name;
  if(id){ // 覆盖
    op="edit"; diff=fieldDiff(oldRec||{},rec,table); logName=(oldRec&&oldRec.name)||name;
    const k=keyOf(table,id);
    if(edits.manual.some(m=>m.table===table&&m.id===id)){const m=edits.manual.find(x=>x.table===table&&x.id===id);Object.assign(m,rec);}
    else edits.overrides[k]=rec;
  }else{ // 新增
    op="add";
    rec.id=(table==="laws"?"mL":"mS")+Date.now(); rec.table=table;
    if(table==="laws"){rec.category=rec.domains[0]||"质量";} 
    edits.manual.push(rec);
  }
  edits.log.push({key:keyOf(table,id||rec.id)+"_"+Date.now(),table,recId:id||rec.id,name:logName,ts:Date.now(),op,diff});
  trimLog();
  persist(); closeEdit();
  if(table==="laws")renderLaws();else renderStandards();
  renderChangePreview();
  toast("已保存（本地）"); pushCloud();
}
function removeRec(table,id){
  const k=keyOf(table,id);
  const rec=getMerged(table).find(r=>r.id===id);
  const name=rec?rec.name:("记录"+id);
  if(!edits.deleted.includes(k)) edits.deleted.push(k);
  // 若属手动新增，直接从 manual 移除
  edits.manual=edits.manual.filter(m=>!(m.table===table&&m.id===id));
  return name;
}
function delRec(table,id){
  if(!confirm("确定删除该记录？"))return;
  const name=removeRec(table,id);
  edits.log.push({key:keyOf(table,id)+"_"+Date.now(),table,recId:id,name,ts:Date.now(),op:"delete"});
  trimLog();
  persist();
  if(table==="laws")renderLaws();else renderStandards();
  renderBatchBar(table); renderChangePreview();
  toast("已删除（本地）"); pushCloud();
}
function persist(){
  saveLS(LS_OVR,edits.overrides); saveLS(LS_DEL,edits.deleted); saveLS(LS_MAN,edits.manual); saveLS(LS_LOG,edits.log);
}
function trimLog(){ if(edits.log.length>200) edits.log=edits.log.slice(-200); }
function fmtTime(ts){ if(!ts)return"-"; const d=new Date(ts); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function fieldDiff(oldR,newR,table){
  const fields=table==="laws"
    ?[["name","法规名称"],["docNumber","发文字号"],["dept","发布部门"],["effectiveDate","实施日期"],["abolishDate","废止日期"],["status","状态"],["domains","所属领域"],["link","原文链接"],["remark","备注"]]
    :[["name","标准名称"],["stdNo","标准编号"],["publisher","发布单位"],["effectiveDate","实施日期"],["abolishDate","废止日期"],["status","状态"],["stdType","标准类型"],["link","原文链接"],["remark","备注"]];
  const diff=[];
  for(const [f,label] of fields){
    const o=Array.isArray(oldR[f])?oldR[f].join("/"):(oldR[f]||"");
    const n=Array.isArray(newR[f])?newR[f].join("/"):(newR[f]||"");
    if(o!==n) diff.push({f:label,old:o,new:n});
  }
  return diff;
}

/* ---------- 云端协同（best-effort） ---------- */
async function loadCloud(){
  // 读走 jsDelivr CDN（实时从 GitHub 仓库取最新 user-edits.json，不等 Pages 重建），不消耗 SCF 资源；写才走 SCF 代理
  try{
    const r=await fetch("https://cdn.jsdelivr.net/gh/haideweili1/laws-list@main/user-edits.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok){ $("#syncDot").className="dot"; $("#syncText").textContent="本地（云端不可用）"; return; }
    const c=await r.json(); const ts=c.ts||0;
    // 兼容：旧版云端文件(带 version/changeLog，无 ts)结构与现版不同，直接合并会污染数据，故跳过
    if(!c.ts && c.version){ $("#syncDot").className="dot"; $("#syncText").textContent="本地（云端为旧版数据，已跳过）"; return; }
    // 覆盖：取较新
    for(const k in (c.overrides||{})){ if(!edits.overrides[k]||ts> (edits._ts||0)) edits.overrides[k]=c.overrides[k]; }
    edits.deleted=[...new Set([...edits.deleted,...(c.deleted||[])])];
    for(const m of (c.manual||[])){ if(!edits.manual.some(x=>x.table===m.table&&x.id===m.id)) edits.manual.push(m); }
    // 云端变更记录同样过滤旧格式残留
    for(const e of (c.log||[])){ if(e&&e.op&&e.name&&e.ts&&!edits.log.some(x=>x.key===e.key)) edits.log.push(e); }
    edits._ts=ts;
    $("#syncDot").className="dot synced"; $("#syncText").textContent="已同步云端";
  }catch(e){     $("#syncDot").className="dot"; $("#syncText").textContent="本地（云端不可用）"; }
}
// 只拉不推：从 jsDelivr CDN 实时合并同事修改，不调用 SCF、不写回，避免误覆盖他人数据且不产生费用
async function cloudPull(){
  if(!edits)return;
  if(document.visibilityState!=="visible")return; // 仅页面可见时拉取，省资源
  const sig=JSON.stringify({m:edits.manual,o:edits.overrides,d:edits.deleted,l:edits.log});
  await loadCloud();
  const sig2=JSON.stringify({m:edits.manual,o:edits.overrides,d:edits.deleted,l:edits.log});
  if(sig!==sig2){ renderLaws(); renderStandards(); renderChangePreview(); } // 仅变化时重渲染，避免闪烁
}
async function pushCloud(){
  if(!SYNC_PROXY)return "未配置同步地址";
  try{
    const body={overrides:edits.overrides,deleted:edits.deleted,manual:edits.manual,log:edits.log,ts:Date.now()};
    const r=await fetch(SYNC_PROXY+"/user-edits.json",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.ok){ $("#syncDot").className="dot synced"; $("#syncText").textContent="已同步云端"; return true; }
    // 非成功：把服务端返回的错误信息带出来，便于前端如实提示（不再假成功）
    let msg="同步失败(HTTP "+r.status+")";
    try{ const j=await r.json(); if(j&&j.message)msg=j.message; }catch(e){}
    return msg;
  }catch(e){ return "网络错误："+e.message; }
}

/* ---------- 同步 / 自动检索 动画 ---------- */
function setBtn(btn,st){
  if(!btn)return;
  const ico=btn.querySelector(".ico");

  if(st==="loading"){ btn.classList.add("loading"); btn.disabled=true; }
  else if(st==="ok"){ btn.classList.add("ok"); if(ico)ico.textContent="✓"; }
  else if(st==="err"){ btn.classList.add("err"); if(ico)ico.textContent="✗"; }
  else { if(ico)ico.textContent=""; }
}
async function manualSync(){
  const btn=document.getElementById("syncBtn");
  setBtn(btn,"loading");
  try{
    const res=await pushCloud();
    await loadCloud();
    if(res===true){ setBtn(btn,"ok"); toast("已同步云端"); }
    else { setBtn(btn,"err"); toast(typeof res==="string"?res:"同步失败"); }
  }catch(e){ setBtn(btn,"err"); toast("同步失败"); }
  finally{ setTimeout(()=>setBtn(btn,"idle"),1500); }
}

/* ---------- 变更记录（手动+自动合并） ---------- */
async function renderChangePreview(){
  const box=$("#changePreview");
  const manual=edits.log.slice().sort((a,b)=>b.ts-a.ts);
  let auto=null;
  try{ auto=await fetch("update-summary.json?t="+Date.now()).then(r=>r.ok?r.json():null); }catch(e){}
  const entries=[];
  manual.forEach(e=>entries.push({kind:"手动",ts:e.ts,e}));
  if(auto&&(auto.runAt||(auto.added||[]).length||(auto.modified||[]).length||(auto.abolished||[]).length))
    entries.push({kind:"自动",ts:new Date(auto.runAt||0).getTime()||0,e:auto});
  entries.sort((a,b)=>b.ts-a.ts);
  if(!entries.length){ box.innerHTML='<span class="muted">暂无变更记录</span>'; return; }
  box.innerHTML=entries.slice(0,5).map(en=>{
    const tag=en.kind==="手动"?'<span class="ct manual">手动</span>':'<span class="ct auto">自动</span>';
    const t=fmtTime(en.ts); let sum="";
    if(en.kind==="手动"){ const e=en.e;
      if(e.op==="add")sum="新增《"+esc(e.name)+"》";
      else if(e.op==="delete")sum="删除《"+esc(e.name)+"》";
      else sum="修改《"+esc(e.name)+"》"+(e.diff&&e.diff.length?("："+e.diff.slice(0,2).map(d=>d.f+" "+d.old+"→"+d.new).join("，")):"");
    } else { const a=en.e; sum="更新：新增"+(a.added||[]).length+" 修改"+(a.modified||[]).length+" 废止"+(a.abolished||[]).length; }
    return '<div class="cri">'+tag+'<span class="ct-time">'+t+'</span><span>'+sum+'</span></div>';
  }).join("");
}
async function openChangelog(){
  $("#clogMask").style.display="flex";
  const box=$("#clogBody"); box.innerHTML="<p>加载中…</p>";
  const manual=edits.log.slice().sort((a,b)=>b.ts-a.ts);
  let auto=null;
  try{ auto=await fetch("update-summary.json?t="+Date.now()).then(r=>r.ok?r.json():null); }catch(e){}
  let h='<h4>手动变更（'+manual.length+'）</h4>';
  if(!manual.length) h+='<p class="muted">暂无手动变更</p>';
  else h+=manual.map(e=>{
    let body;
    if(e.op==="add") body='<p>➕ 新增《'+esc(e.name)+'》</p>';
    else if(e.op==="delete") body='<p>🗑 删除《'+esc(e.name)+'》</p>';
    else body='<p>✏ 修改《'+esc(e.name)+'》</p>'+(e.diff&&e.diff.length?'<ul>'+e.diff.map(d=>'<li>'+d.f+'：<span class="old">'+(esc(d.old)||'（空）')+'</span> → <span class="new">'+(esc(d.new)||'（空）')+'</span></li>').join("")+'</ul>':"");
    return '<div class="cl-entry"><div class="cl-meta">'+fmtTime(e.ts)+'</div>'+body+'</div>';
  }).join("");
  h+='<h4>自动更新</h4>';
  if(!auto) h+='<p class="muted">暂无自动更新记录（后端接入后显示）</p>';
  else{
    h+='<p>运行时间：'+esc(auto.runAt||"-")+'</p>';
    if(auto.added&&auto.added.length) h+='<p>➕ 新增：'+auto.added.map(x=>typeof x==="string"?esc(x):esc(x.name)).join("、")+'</p>';
    if(auto.modified&&auto.modified.length){
      h+='<p>✏ 修改：</p><ul>'+auto.modified.map(x=>{
        if(typeof x==="string") return '<li>'+esc(x)+'</li>';
        const diff=(x.diff||[]).map(d=>d.f+'：'+(esc(d.old)||'（空）')+' → '+(esc(d.new)||'（空）')).join("；");
        return '<li>'+esc(x.name)+(diff?'（'+diff+'）':'')+'</li>';
      }).join("")+'</ul>';
    }
    if(auto.abolished&&auto.abolished.length) h+='<p>🗑 废止：'+auto.abolished.map(x=>typeof x==="string"?esc(x):esc(x.name)).join("、")+'</p>';
  }
  box.innerHTML=h;
}

    edits.log.push({key:k+"_"+Date.now(),table,recId:id,name:rec.name,ts:Date.now(),op:"edit",diff:[{f:"状态",old:oldStatus,new:ns}]});

  const rows=currentRows(table);
  const cols=table==="laws"
    ?[["法规名称","name"],["发文字号","docNumber"],["发布部门","dept"],["实施日期","effectiveDate"],["状态","status"],["所属领域","domains"],["原文链接","link"],["备注","remark"]]
    :[["标准编号","stdNo"],["标准名称","name"],["标准类型","stdType"],["发布单位","publisher"],["实施日期","effectiveDate"],["状态","status"],["原文链接","link"],["备注","remark"]];
  const head=["序号",...cols.map(c=>c[0])];
  const data=rows.map((r,i)=>[i+1,...cols.map(c=>Array.isArray(r[c[1]])?r[c[1]].join("/"):(r[c[1]]||""))]);
  const ws=XLSX.utils.aoa_to_sheet([head,...data]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,table==="laws"?"法律法规":"产品标准");
  XLSX.writeFile(wb,(table==="laws"?"法律法规":"产品标准")+"清单.xlsx");
}
function exportPDF(table){exportCanvas(table,true);}
function exportPNG(table){exportCanvas(table,false);}
function exportCanvas(table,asPdf){
  const el=table==="laws"?$("#lawTable"):$("#stdTable");
  html2canvas(el,{scale:2}).then(canvas=>{
    if(!asPdf){const a=document.createElement("a");a.download=(table==="laws"?"法律法规":"产品标准")+"清单.png";a.href=canvas.toDataURL("image/png");a.click();return;}
    const img=canvas.toDataURL("image/png");const p=new window.jspdf.jsPDF("l","mm","a4");
    const pw=p.internal.pageSize.getWidth(),ph=p.internal.pageSize.getHeight();
    const iw=pw, ih=canvas.height*ik(pw)/canvas.width; let y=0;
    function ik(w){return w/canvas.width;}
    let pos=0; const h=ih;
    // 简单分页
    let remaining=canvas.height, pageH=ph*canvas.width/pw;
    const pageCanvas=document.createElement("canvas");pageCanvas.width=canvas.width;
    const ctx=pageCanvas.getContext("2d");
    let sy=0;
    while(sy<canvas.height){
      const sh=Math.min(pageH,canvas.height-sy);
      pageCanvas.height=sh;
      ctx.drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
      const pImg=pageCanvas.toDataURL("image/png");
      if(sy>0)p.addPage();
      const dh=sh*ik(pw);
      p.addImage(pImg,"PNG",0,0,pw,dh);
      sy+=sh;
    }
    p.save((table==="laws"?"法律法规":"产品标准")+"清单.pdf");
  });
}
