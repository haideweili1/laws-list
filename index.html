<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法律法规与产品标准清单</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --line:#e3e8ef; --text:#1f2733; --muted:#6b7785;
    --pri:#2563eb; --pri-d:#1d4ed8; --ok:#16a34a; --warn:#ea580c; --bad:#dc2626; --gray:#94a3b8;
    --tag:#eef2ff; --tag-t:#4338ca;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Microsoft YaHei",Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  header{background:linear-gradient(90deg,#1e3a8a,#2563eb);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .meta{font-size:12px;opacity:.85}
  .top-tabs{display:flex;gap:4px;padding:10px 22px 0;background:var(--card);border-bottom:1px solid var(--line)}
  .top-tabs button{border:none;background:none;padding:10px 18px;font-size:15px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:600}
  .top-tabs button.active{color:var(--pri);border-bottom-color:var(--pri)}
  .sub-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 22px;background:var(--card)}
  .sub-tabs button{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:16px;cursor:pointer;color:var(--muted);font-size:13px}
  .sub-tabs button.active{background:var(--pri);color:#fff;border-color:var(--pri)}
  .toolbar{display:flex;gap:10px;align-items:center;padding:10px 22px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line)}
  .toolbar input[type=search]{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text)}
  .btn:hover{background:#f0f4ff}
  .btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
  .btn.pri:hover{background:var(--pri-d)}
  .wrap{padding:0 22px 40px;background:var(--card)}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:#f1f5f9;position:relative;white-space:nowrap}
  th .fbtn{cursor:pointer;color:var(--pri);margin-left:4px;font-size:11px;user-select:none}
  tbody tr:nth-child(even){background:#fafbfc}
  tbody tr:hover{background:#eff6ff}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
  .badge.ok{background:#dcfce7;color:var(--ok)}
  .badge.warn{background:#ffedd5;color:var(--warn)}
  .badge.bad{background:#fee2e2;color:var(--bad)}
  .badge.gray{background:#e2e8f0;color:var(--gray)}
  .tag{display:inline-block;background:var(--tag);color:var(--tag-t);padding:1px 7px;border-radius:8px;font-size:11px;margin:1px 2px}
  a.link{color:var(--pri);text-decoration:none;cursor:pointer}
  a.link:hover{text-decoration:underline}
  /* 原文链接做成小按钮：加大点击热区，手机上也好点（仅用于“查看原文”，不影响操作列的改/删） */
  a.link.doc{display:inline-block;padding:6px 12px;border:1px solid #cfe0f5;border-radius:6px;
             background:#f2f7fd;white-space:nowrap;line-height:1.2;font-size:13px;text-decoration:none}
  a.link.doc:hover{background:#e3eefb;border-color:#9dbfe6;text-decoration:none}
  a.link.doc:active{background:#d4e4f7}
  .cnt{color:var(--muted);font-size:12px;margin-left:auto}
  .filter-pop{position:absolute;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:8px;z-index:50;min-width:160px;max-height:260px;overflow:auto;display:none}
  .filter-pop label{display:block;padding:4px 6px;cursor:pointer;font-size:13px;white-space:nowrap}
  .filter-pop .fp-actions{display:flex;gap:6px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
  .modal{background:#fff;border-radius:12px;padding:20px;width:520px;max-width:92vw;max-height:90vh;overflow:auto;position:relative}
  .modal h3{margin:0 0 14px}
  .close-x{position:absolute;top:12px;right:14px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;user-select:none}
  .close-x:hover{background:#f1f5f9;color:var(--text)}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .modal input,.modal select,.modal textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
  .modal .row{display:flex;gap:10px}
  .modal .row>div{flex:1}
  .modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gray);margin-right:6px}
  .dot.synced{background:var(--ok)} .dot.err{background:var(--bad)} .dot.dirty{background:var(--warn)}
  .back-top{position:fixed;right:20px;bottom:24px;width:46px;height:46px;border-radius:50%;background:var(--pri);color:#fff;border:none;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.28);opacity:0;visibility:hidden;transform:translateY(8px);transition:.25s;z-index:210}
  .back-top.show{opacity:1;visibility:visible;transform:translateY(0)}
  .back-top:hover{background:var(--pri-d)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2733;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.3s;z-index:200;pointer-events:none}
  .toast.show{opacity:1}
  .manual{background:#faf5ff} .modified{background:#fff7ed}
  .hidden{display:none!important}
.head-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn .ico{display:inline-block;width:14px;text-align:center}
.btn.loading{position:relative}
.btn.loading .ico::after{content:"";display:inline-block;width:10px;height:10px;border:2px solid #cbd5e1;border-top-color:var(--pri);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.err{color:var(--bad);border-color:var(--bad)}
.btn.running{opacity:.65}
.btn.running .ico::after{content:"";display:inline-block;width:10px;height:10px;border:2px solid #cbd5e1;border-top-color:var(--pri);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}
.btn-label{margin-left:2px}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.7;cursor:default}
.change-card{margin:10px 22px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.cc-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:6px}
.cc-body .cri{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px;border-bottom:1px dashed #eef}
.cc-body .cri:last-child{border-bottom:none}
.ct{display:inline-block;padding:1px 7px;border-radius:8px;font-size:11px}
.ct.manual{background:#ede9fe;color:#6d28d9}
.ct.auto{background:#dcfce7;color:#15803d}
.ct-time{color:var(--muted);font-size:12px}
.cc-status{font-size:12px;color:var(--muted);padding:6px 2px 0;min-height:16px;line-height:1.5}
.cc-status.running{color:#b8860b}
.cc-status.ok{color:var(--ok)}
.cc-status.err{color:var(--bad)}
.muted{color:var(--muted)}
.cl-entry{border-bottom:1px solid var(--line);padding:8px 0}
.cl-entry:last-child{border-bottom:none}
.cl-meta{color:var(--muted);font-size:12px;margin-bottom:2px}
.cl-entry ul{margin:4px 0 0;padding-left:18px}
.old{color:var(--bad)} .new{color:var(--ok)}
/* 待确认更新（自动检索提案闸门） */
.prop-card{margin:10px 22px 0;background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:10px 14px}
.prop-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.prop-acts{display:flex;gap:8px;flex-wrap:wrap}
.prop-tip{font-weight:400;font-size:12px;color:#92400e;margin-top:4px}
.prop-list{margin-top:8px;max-height:440px;overflow:auto}
.prop-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed #fde68a;align-items:flex-start}
.prop-item:last-child{border-bottom:none}
.prop-item input[type=checkbox]{margin-top:4px;width:16px;height:16px;flex:none;cursor:pointer}
.prop-main{flex:1;font-size:13px;line-height:1.6;min-width:0;word-break:break-word}
.prop-title{font-weight:600}
.pt{display:inline-block;padding:1px 7px;border-radius:8px;font-size:11px;margin-right:6px}
.pt.add{background:#dcfce7;color:#15803d}
.pt.update{background:#dbeafe;color:#1d4ed8}
.pt.abolish{background:#fee2e2;color:#b91c1c}
.pt.status_switch{background:#ede9fe;color:#6d28d9}
.pt.reject{background:#fee2e2;color:#b91c1c}
.prop-diff{margin:3px 0 0;padding-left:18px}
.prop-diff li{font-size:12px}
.prop-sub{font-size:12px;color:var(--muted);word-break:break-all}
/* 两栏：左＝通过质检可直接应用；右＝未通过质检的待核实线索（只看不写） */
.prop-cols{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.prop-col{flex:1 1 380px;min-width:0}
.prop-col-h{font-weight:600;font-size:13px;padding-bottom:6px;border-bottom:2px solid #fcd34d;margin-bottom:4px}
.prop-col-h.rj{border-bottom-color:#fca5a5}
.prop-col-h .prop-tip{display:inline;margin:0}
.prop-empty{font-size:12px;color:var(--muted);padding:10px 0}
.rj-reason{margin:3px 0 0;padding-left:18px}
.rj-reason li{font-size:12px;color:#b91c1c}
.batchbar{display:flex;gap:10px;align-items:center;padding:8px 22px;background:#eff6ff;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .batchbar.hidden{display:none}
  .batchbar .btn[disabled]{opacity:.5;cursor:not-allowed}
  /* 筛选常驻提示条：筛选后常显“在哪一列筛了什么”，并可一键清除 */
  .filterbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 22px;background:#fff7ed;border-bottom:1px solid var(--line)}
  .filterbar.hidden{display:none}
  .filterbar .fbar-tip{font-size:13px;color:var(--muted);font-weight:600}
  .filterbar .fchip{display:inline-flex;align-items:center;gap:5px;background:#ffe8cc;color:#9a3412;padding:3px 10px;border-radius:14px;font-size:12px;border:1px solid #fed7aa}
  .filterbar .fchip .fx{color:#9a3412;cursor:pointer;font-weight:700;font-size:12px;line-height:1}
  .filterbar .fchip .fx:hover{color:#7c2d12}
  .filterbar .btn.sm{padding:4px 10px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>法律法规与产品标准清单</h1>
  <div class="meta">数据更新时间：<span id="lastUpdated">-</span> ｜ <span class="dot" id="syncDot"></span><span id="syncText">本地</span></div>
  <div class="head-actions">
    <button class="btn" id="syncBtn" onclick="manualSync()"><span class="ico"></span>同步</button>
    <button class="btn" id="retrieveBtn" onclick="triggerRetrieve()"><span class="ico"></span><span class="btn-label">自动检索</span></button>
    <a class="btn" href="retrieval-report.html" target="_blank" rel="noopener">查看检索报告</a>
  </div>
</header>

<div class="top-tabs">
  <button id="tab-laws" class="active" onclick="switchTop('laws')">法律法规</button>
  <button id="tab-standards" onclick="switchTop('standards')">产品标准</button>
</div>

<!-- 最近变更预览卡 -->
<div class="change-card">
  <div class="cc-head"><span>最近变更</span><button class="btn sm" onclick="openChangelog()">查看详细记录</button></div>
  <div id="changePreview" class="cc-body"><span class="muted">暂无变更记录</span></div>
  <div id="retrieveStatus" class="cc-status"></div>
</div>

<!-- 待确认更新：自动检索只出提案，必须逐条勾选确认后才写入清单 -->
<div class="prop-card" id="proposalCard" style="display:none">
  <div class="prop-head">
    <span>待确认更新 <span id="propCount" class="prop-tip"></span></span>
    <span class="prop-acts">
      <button class="btn sm" onclick="toggleAllProposals(true)">全选</button>
      <button class="btn sm" onclick="toggleAllProposals(false)">全不选</button>
      <button class="btn sm pri" id="propApplyBtn" onclick="applyProposals()">确认应用选中项</button>
      <button class="btn sm" id="propDiscardBtn" onclick="discardProposals()">全部忽略</button>
    </span>
  </div>
  <div class="prop-tip">自动检索结果<b>不会自动改数据</b>。左栏是已通过 7 道自动质检的条目，仍请核对后勾选；右栏是质检没通过的线索，<b>只作参考、不会写入清单</b>，可据此判断检索质量。</div>
  <div class="prop-cols">
    <div class="prop-col">
      <div class="prop-col-h">✅ 可直接应用 <span id="propCountL" class="prop-tip"></span></div>
      <div class="prop-list" id="propList"></div>
    </div>
    <div class="prop-col">
      <div class="prop-col-h rj">⚠️ 待核实线索（未通过质检） <span id="propCountR" class="prop-tip"></span></div>
      <div class="prop-list" id="propRejectList"></div>
    </div>
  </div>
  <div class="cc-status" id="propStatus"></div>
</div>

<!-- 法律法规视图 -->
<section id="view-laws">
  <div class="sub-tabs" id="lawSubTabs"></div>
  <div class="toolbar">
    <input type="search" id="lawSearch" placeholder="搜索法规名称/发布部门/备注…" oninput="onSearch('laws',this.value)">
    <button class="btn pri" onclick="openEdit('laws')">+ 新增法规</button>
    <button class="btn" onclick="exportExcel('laws')">导出Excel</button>
    <button class="btn" onclick="exportPDF('laws')">导出PDF</button>
    <button class="btn" onclick="exportPNG('laws')">导出图片</button>
    <span class="cnt" id="lawCnt"></span>
  </div>
  <div class="batchbar hidden" id="batchBar-laws">
    <span id="batchInfo-laws"></span>
    <button class="btn pri sm" onclick="batchDelete('laws')">批量删除</button>
    <button class="btn sm" onclick="openBatchStatus('laws')">批量改状态</button>
    <button class="btn sm" onclick="openBatchDomain('laws')">批量设领域</button>
  </div>
  <div class="filterbar hidden" id="filterBar-laws"></div>
  <div class="wrap">
    <table id="lawTable">
      <thead><tr>
        <th>序号</th><th>法规名称</th><th>发布部门</th><th>实施日期</th>
        <th>状态<span class="fbtn" data-f="status">▾筛选</span></th>
        <th>所属领域<span class="fbtn" data-f="domains">▾筛选</span></th>
        <th>原文链接</th><th>备注</th><th>操作<br><input type="checkbox" id="selAllLaws" onclick="toggleSelAll('laws',this.checked)"></th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<!-- 产品标准视图 -->
<section id="view-standards" class="hidden">
  <div class="toolbar">
    <input type="search" id="stdSearch" placeholder="搜索标准名称/编号/类型/发布单位/备注…" oninput="onSearch('standards',this.value)">
    <button class="btn pri" onclick="openEdit('standards')">+ 新增标准</button>
    <button class="btn" onclick="exportExcel('standards')">导出Excel</button>
    <button class="btn" onclick="exportPDF('standards')">导出PDF</button>
    <button class="btn" onclick="exportPNG('standards')">导出图片</button>
    <span class="cnt" id="stdCnt"></span>
  </div>
  <div class="batchbar hidden" id="batchBar-standards">
    <span id="batchInfo-standards"></span>
    <button class="btn pri sm" onclick="batchDelete('standards')">批量删除</button>
    <button class="btn sm" onclick="openBatchStatus('standards')">批量改状态</button>
  </div>
  <div class="filterbar hidden" id="filterBar-standards"></div>
  <div class="wrap">
    <table id="stdTable">
      <thead><tr>
        <th>序号</th><th>标准编号</th><th>标准名称</th>
        <th>标准类型<span class="fbtn" data-f="stdType">▾筛选</span></th>
        <th>发布单位</th><th>实施日期</th>
        <th>状态<span class="fbtn" data-f="status">▾筛选</span></th>
        <th>原文链接</th><th>备注</th><th>操作<br><input type="checkbox" id="selAllStds" onclick="toggleSelAll('standards',this.checked)"></th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<!-- 筛选弹层容器 -->
<div id="filterLayer"></div>

<!-- 编辑弹窗 -->
<div class="modal-mask" id="editMask" onclick="if(event.target===this)closeEdit()">
  <div class="modal">
    <span class="close-x" onclick="closeEdit()" title="关闭">✕</span>
    <h3 id="editTitle">编辑</h3>
    <input type="hidden" id="eTable"><input type="hidden" id="eId">
    <div class="row">
      <div><label id="lblName">法规名称 *</label><input id="eName"></div>
      <div id="rowNo"><label id="lblNo">标准编号</label><input id="eNo"></div>
    </div>
    <div class="row">
      <div><label id="lblDept">发布部门</label><input id="eDept"></div>
      <div><label>实施日期</label><input id="eDate" placeholder="YYYY-MM-DD"></div>
    </div>
    <div class="row">
      <div><label>状态</label>
        <select id="eStatus"><option>现行有效</option><option>即将实施</option><option>已废止</option></select>
      </div>
      <div><label id="lblType">标准类型</label>
        <select id="eType">
          <option>国家标准</option><option>国际标准</option><option>欧盟标准</option><option>美国FDA</option>
          <option>法国法令</option><option>法国食品级法规通告</option><option>德国LFGB</option><option>德国标准</option>
          <option>意大利标准</option><option>SVHC</option><option>美国加州</option><option>巴西497法令</option><option>行业标准</option><option>其他</option>
        </select>
      </div>
    </div>
    <label>废止日期（可选，填了到期后自动转为「已废止」）</label>
    <input id="eAbolish" placeholder="YYYY-MM-DD，留空表示暂无废止计划">
    <label>所属领域（多选，逗号分隔）</label>
    <input id="eDomains" placeholder="质量,环境,职业健康安全,信息安全,社会责任,反恐">
    <label>原文链接</label><input id="eLink" placeholder="https://">
    <label>备注</label><textarea id="eRemark" rows="3"></textarea>
    <div class="acts">
      <button class="btn" onclick="closeEdit()">取消</button>
      <button class="btn pri" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 批量改状态弹窗 -->
<div class="modal-mask" id="batchStatusMask" onclick="if(event.target===this)closeBatchStatus()">
  <div class="modal">
    <span class="close-x" onclick="closeBatchStatus()" title="关闭">✕</span>
    <h3>批量改状态</h3>
    <p class="muted" id="batchStatusInfo"></p>
    <label>选择状态</label>
    <select id="bStatus"><option>现行有效</option><option>即将实施</option><option>已废止</option></select>
    <div class="acts"><button class="btn" onclick="closeBatchStatus()">取消</button><button class="btn pri" onclick="applyBatchStatus()">应用</button></div>
  </div>
</div>

<!-- 批量设领域弹窗 -->
<div class="modal-mask" id="batchDomainMask" onclick="if(event.target===this)closeBatchDomain()">
  <div class="modal">
    <span class="close-x" onclick="closeBatchDomain()" title="关闭">✕</span>
    <h3>批量设领域</h3>
    <p class="muted" id="batchDomainInfo"></p>
    <label>所属领域（多选，逗号分隔）</label>
    <input id="bDomain" placeholder="质量,环境,职业健康安全,信息安全,社会责任,反恐">

<script>
const SYNC_PROXY = "https://1460512300-c9zrn53ghd.ap-guangzhou.tencentscf.com";
const LS_OVR="lawOverrides_v3", LS_DEL="deletedLaws_v3", LS_MAN="manualLaws_v3", LS_LOG="changeLog_v1", LS_NEEDSYNC="lawNeedSync_v1";
let DATA={laws:[],standards:[],lastUpdated:""};
let edits={overrides:{},deleted:[],manual:[],log:[]};
let needSync=false;                   // 本地有未推送的修改 → 显示"未同步(待同步)"
let syncedTs=0;                     // 上次成功同步时间戳
let cloudOk=true;                   // 云端是否可用
let selected=new Set();
const state={top:"laws",lawSub:"全部",
  filters:{laws:{status:new Set(),domains:new Set()},standards:{stdType:new Set(),status:new Set()}},
  search:{laws:"",standards:""}};

/* ---------- 工具 ---------- */
function $(s){return document.querySelector(s)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function loadLS(k){try{const _v=localStorage.getItem(k);return _v?JSON.parse(_v):null}catch(e){return null}}
function saveLS(k,v){localStorage.setItem(k,JSON.stringify(v))}
function keyOf(table,id){return table+"::"+id}
function statusBadge(s){const m={"现行有效":"ok","即将实施":"warn","已废止":"bad"};const c=m[s]||"gray";return `<span class="badge ${c}">${s||"-"}</span>`}
function domainsTags(arr){return (arr||[]).map(d=>`<span class="tag">${d}</span>`).join("")}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function jsStr(s){return (s==null?"":String(s)).replace(/[\\']/g,c=>({"\\":"\\\\","'":"\\'"}[c]))}

/* ---------- 数据加载与合并 ---------- */
async function init(){
  // 单文件加载：直接 fetch data.json（数据已瘦身；此前“截断”是误判，真凶是代码 bug 已修复）
  DATA={laws:[],standards:[],lastUpdated:""};
  try{
    const r=await fetch("data.json?t="+Date.now());
    if(r.ok){ const d=await r.json(); if(d&&(d.laws||d.standards))DATA=d; }
  }catch(e){ console.error("加载 data.json 失败",e); }
  $("#lastUpdated").textContent=DATA.lastUpdated||"-";
  // 本地编辑
  edits.overrides=loadLS(LS_OVR)||{}; edits.deleted=loadLS(LS_DEL)||[]; edits.manual=loadLS(LS_MAN)||[];
  // 变更记录：丢弃旧版格式的残留记录（早期版本只记了时间，没有法规名和改动详情，显示为空的《》）
  const _rawLog=loadLS(LS_LOG)||[];
  edits.log=_rawLog.filter(e=>e&&e.op&&e.name&&e.ts);
  if(edits.log.length!==_rawLog.length) saveLS(LS_LOG,edits.log);
  // 云端合并（best-effort，仅打开时拉一次）
  await loadCloud();
  // 同步状态：以“本地是否有未推送修改”为准（持久化标记，刷新后仍正确）
  needSync = loadLS(LS_NEEDSYNC)==="1";
  updateSyncUI();
  // 返回顶部按钮：滚动超过一屏才显示
  const bt=document.getElementById("backTop");
  window.addEventListener("scroll",()=>{ if(bt) bt.classList.toggle("show", window.scrollY>400); },{passive:true});
  renderChangePreview();
  // 待确认更新（自动检索提案）：有提案才显示面板
  loadProposals();
  // 子分类Tab
  const subs=["全部","质量","环境与职业健康","信息安全","反恐"];
  $("#lawSubTabs").innerHTML=subs.map(s=>`<button class="${s==='全部'?'active':''}" data-s="${s}" onclick="switchSub('${s}')">${s}</button>`).join("");
  buildFilterOptions();
  renderLaws();renderStandards();
  // 已取消后台自动轮询（原每45秒拉一次，耗 SCF 资源且会导致状态来回跳）。
  // 改为：打开时拉一次云端(见上方 loadCloud)，之后只有点顶部「同步」才连云端（低消耗）。
}
function getMerged(table){
  const base=table==="laws"?DATA.laws:DATA.standards;
  const prefix=table+"::";
  let arr=base.map(r=>({...r}));
  // 覆盖
  for(const k in edits.overrides){ if(k.startsWith(prefix)){const id=k.slice(prefix.length);const rec=arr.find(x=>x.id===id);if(rec)Object.assign(rec,edits.overrides[k]);} }
  // 删除
  const del=new Set((Array.isArray(edits.deleted)?edits.deleted:[]).filter(k=>k.startsWith(prefix)).map(k=>k.slice(prefix.length)));
  arr=arr.filter(r=>!del.has(r.id));
  // 手动新增
  for(const m of edits.manual){ if(m.table===table) arr.push({...m}); }
  return arr;
}

/* ---------- 法律法规渲染 ---------- */
const LAW_COLS=["name","docNumber","dept","effectiveDate","status","domains","link","remark"];
function renderLaws(){
  let arr=getMerged("laws");
  if(state.lawSub!=="全部") arr=arr.filter(r=>r.category===state.lawSub);
  const f=state.filters.laws, q=state.search.laws.trim().toLowerCase();
  if(f.status.size) arr=arr.filter(r=>f.status.has(r.status));
  if(f.domains.size) arr=arr.filter(r=>(r.domains||[]).some(d=>f.domains.has(d)));
  if(q) arr=arr.filter(r=>LAW_COLS.some(c=>String(r[c]||"").toLowerCase().includes(q)));
  const tb=$("#lawTable tbody"); tb.innerHTML=arr.map((r,i)=>{
    const manual=edits.manual.some(m=>m.table==="laws"&&m.id===r.id);
    const cls=manual?"manual":(edits.overrides[keyOf("laws",r.id)]?"modified":"");
    return `<tr class="${cls}">
      <td>${i+1}</td><td>${esc(r.name)}</td><td>${esc(r.dept)}</td><td>${esc(r.effectiveDate)}</td>
      <td>${statusBadge(r.status)}</td><td>${domainsTags(r.domains)}</td>
      <td>${r.link?`<a class="link doc" href="${esc(r.link)}" target="_blank">查看原文</a>`:"-"}</td>
      <td>${esc(r.remark)}</td>
      <td><input type="checkbox" class="sel" data-k="${keyOf('laws',r.id)}" ${selected.has(keyOf('laws',r.id))?'checked':''} onchange="onRowCheck(this)"> <a class="link" onclick="openEdit('laws','${r.id}')">改</a> <a class="link" onclick="delRec('laws','${r.id}')">删</a></td>
    </tr>`;
  }).join("");
  $("#lawCnt").textContent=`共 ${arr.length} 条`;
  renderBatchBar("laws");
  renderFilterBar("laws");
}
const STD_COLS=["stdNo","name","stdType","publisher","effectiveDate","status","link","remark"];
function renderStandards(){
  let arr=getMerged("standards");
  const f=state.filters.standards, q=state.search.standards.trim().toLowerCase();
  if(f.stdType.size) arr=arr.filter(r=>f.stdType.has(r.stdType));
  if(f.status.size) arr=arr.filter(r=>f.status.has(r.status));
  if(q) arr=arr.filter(r=>STD_COLS.some(c=>String(r[c]||"").toLowerCase().includes(q)));
  const tb=$("#stdTable tbody"); tb.innerHTML=arr.map((r,i)=>{
    const manual=edits.manual.some(m=>m.table==="standards"&&m.id===r.id);
    const cls=manual?"manual":(edits.overrides[keyOf("standards",r.id)]?"modified":"");
    return `<tr class="${cls}">
      <td>${i+1}</td><td>${esc(r.stdNo)}</td><td>${esc(r.name)}</td><td>${esc(r.stdType)}</td><td>${esc(r.publisher)}</td>
      <td>${esc(r.effectiveDate)}</td><td>${statusBadge(r.status)}</td>
      <td>${r.link?`<a class="link doc" href="${esc(r.link)}" target="_blank">查看原文</a>`:"-"}</td>
      <td>${esc(r.remark)}</td>
      <td><input type="checkbox" class="sel" data-k="${keyOf('standards',r.id)}" ${selected.has(keyOf('standards',r.id))?'checked':''} onchange="onRowCheck(this)"> <a class="link" onclick="openEdit('standards','${r.id}')">改</a> <a class="link" onclick="delRec('standards','${r.id}')">删</a></td>
    </tr>`;
  }).join("");
  $("#stdCnt").textContent=`共 ${arr.length} 条`;
  renderBatchBar("standards");
  renderFilterBar("standards");
}

/* ---------- 筛选下拉 ---------- */
function buildFilterOptions(){
  const lawStatus=[...new Set(DATA.laws.map(r=>r.status))].filter(Boolean);
  const lawDom=[...new Set(DATA.laws.flatMap(r=>r.domains||[]))].filter(Boolean);
  const stdType=[...new Set(DATA.standards.map(r=>r.stdType))].filter(Boolean);
  const stdStatus=[...new Set(DATA.standards.map(r=>r.status))].filter(Boolean);
  window.__filt={laws:{status:lawStatus,domains:lawDom},standards:{stdType:stdType,status:stdStatus}};
}
document.addEventListener("click",e=>{
  const fb=e.target.closest(".fbtn");
  if(fb){ e.stopPropagation(); openFilter(fb); return; }
  if(!e.target.closest(".filter-pop")) $("#filterLayer").innerHTML="";
});
function openFilter(btn){
  const table=state.top; const fkey=btn.dataset.f;
  const vals=window.__filt[table][fkey]||[];
  const sel=state.filters[table][fkey];
  const id="fp_"+table+"_"+fkey;
  const html=`<div class="filter-pop" style="display:block" id="${id}">
    ${vals.map(v=>`<label><input type="checkbox" value="${esc(v)}" ${sel.has(v)?"checked":""}> ${esc(v)}</label>`).join("")}
    <div class="fp-actions"><button class="btn" onclick="clearFilter('${table}','${fkey}')">清除</button><button class="btn pri" onclick="$('#filterLayer').innerHTML=''">确定</button></div>
  </div>`;
  const layer=$("#filterLayer"); layer.innerHTML=html;
  const pop=$("#"+id);
  const r=btn.getBoundingClientRect(); pop.style.left=r.left+"px"; pop.style.top=(r.bottom+4)+"px";
  pop.querySelectorAll("input").forEach(cb=>cb.onchange=()=>{cb.checked?sel.add(cb.value):sel.delete(cb.value); if(table==="laws")renderLaws();else renderStandards();});
}
function clearFilter(table,fkey){state.filters[table][fkey].clear(); if(table==="laws")renderLaws();else renderStandards(); $("#filterLayer").innerHTML="";}
/* 筛选常驻提示条：显示“在哪一列筛了什么值”，并支持单条移除 / 一键清除全部 */
const FILTER_LABELS={laws:{status:"状态",domains:"所属领域"},standards:{stdType:"标准类型",status:"状态"}};
function renderFilterBar(table){
  const bar=$("#filterBar-"+table); if(!bar) return;
  const f=state.filters[table]; const chips=[];
  for(const fkey in f){
    const set=f[fkey];
    if(set && set.size){
      const label=FILTER_LABELS[table][fkey]||fkey;
      set.forEach(v=>{ chips.push(`<span class="fchip">${esc(label)}：${esc(v)} <span class="fx" onclick="clearOneFilter('${table}','${fkey}','${jsStr(v)}')" title="移除该筛选">✕</span></span>`); });
    }
  }
  if(chips.length){
    bar.innerHTML=`<span class="fbar-tip">当前筛选：</span>${chips.join("")}<button class="btn sm" onclick="clearAllFilters('${table}')">清除全部筛选</button>`;
    bar.classList.remove("hidden");
  }else{ bar.innerHTML=""; bar.classList.add("hidden"); }
}
function clearOneFilter(table,fkey,val){ state.filters[table][fkey].delete(val); if(table==="laws")renderLaws();else renderStandards(); }
function clearAllFilters(table){ for(const k in state.filters[table]) state.filters[table][k].clear(); if(table==="laws")renderLaws();else renderStandards(); }

/* ---------- 搜索/切换 ---------- */
function onSearch(table,v){state.search[table]=v; if(table==="laws")renderLaws();else renderStandards();}
function switchTop(t){state.top=t; $("#tab-laws").classList.toggle("active",t==="laws"); $("#tab-standards").classList.toggle("active",t==="standards"); $("#view-laws").classList.toggle("hidden",t!=="laws"); $("#view-standards").classList.toggle("hidden",t!=="standards");}
function switchSub(s){state.lawSub=s; document.querySelectorAll("#lawSubTabs button").forEach(b=>b.classList.toggle("active",b.dataset.s===s)); renderLaws();}

/* ---------- 编辑 ---------- */
function openEdit(table,id){
  $("#eTable").value=table; $("#eId").value=id||"";
  const isLaw=table==="laws";
  $("#editTitle").textContent=(id?"编辑":"新增")+(isLaw?"法规":"标准");
  $("#lblName").textContent=isLaw?"法规名称 *":"标准名称 *";
  $("#lblNo").textContent="标准编号";
  $("#rowNo").style.display=isLaw?"none":"";   // 法规不再展示发文字号（原值仍保留在 eNo 中，保存时原样写回，不丢数据）
  $("#lblDept").textContent=isLaw?"发布部门":"发布单位";
  $("#lblType").parentElement.style.display=isLaw?"none":"";
  const rec=id?(getMerged(table).find(r=>r.id===id)||{}):{};
  $("#eName").value=rec.name||""; $("#eNo").value=rec.docNumber||rec.stdNo||"";
  $("#eDept").value=rec.dept||rec.publisher||""; $("#eDate").value=rec.effectiveDate||"";
  $("#eStatus").value=rec.status||"现行有效";
  $("#eType").value=rec.stdType||"国家标准";
  $("#eDomains").value=(rec.domains||[]).join(",");
  $("#eLink").value=rec.link||""; $("#eRemark").value=rec.remark||"";
  $("#eAbolish").value=rec.abolishDate||"";
  $("#editMask").style.display="flex";
}
function closeEdit(){$("#editMask").style.display="none"}
function saveEdit(){
  try{
    const table=$("#eTable").value, id=$("#eId").value, name=$("#eName").value.trim();
    if(!name){toast("名称必填");return;}
    const oldRec=id?getMerged(table).find(r=>r.id===id):null;
    const rec={
      name:name,
      docNumber:table==="laws"?$("#eNo").value.trim():"",
      stdNo:table==="standards"?$("#eNo").value.trim():"",
      dept:table==="laws"?$("#eDept").value.trim():"",
      publisher:table==="standards"?$("#eDept").value.trim():"",
      effectiveDate:$("#eDate").value.trim(),
      status:$("#eStatus").value,
      stdType:table==="standards"?$("#eType").value:"",
      domains:table==="laws"?$("#eDomains").value.split(",").map(s=>s.trim()).filter(Boolean):[],
      link:$("#eLink").value.trim(),
      remark:$("#eRemark").value.trim(),
      abolishDate:$("#eAbolish").value.trim(),
      region:name.includes("广东")?"广东":""
    };
    let op, diff=null, logName=name;
    if(id){ // 覆盖
      op="edit"; diff=fieldDiff(oldRec||{},rec,table); logName=(oldRec&&oldRec.name)||name;
      const k=keyOf(table,id);
      if(edits.manual.some(m=>m.table===table&&m.id===id)){const m=edits.manual.find(x=>x.table===table&&x.id===id);Object.assign(m,rec);m.ts=Date.now();}
      else edits.overrides[k]=rec;
    }else{ // 新增
      op="add";
      rec.id=(table==="laws"?"mL":"mS")+Date.now(); rec.table=table; rec.ts=Date.now();
      if(table==="laws"){rec.category=rec.domains[0]||"质量";} 
      edits.manual.push(rec);
    }
    edits.log.push({key:keyOf(table,id||rec.id)+"_"+Date.now(),table,recId:id||rec.id,name:logName,ts:Date.now(),op,diff});
    trimLog();
    persist();
    if(table==="laws")renderLaws();else renderStandards();
    renderChangePreview();
    toast("已保存，请点击顶部「同步」上传云端");
    closeEdit();
    // 手动同步：改完不再自动推送，需点顶部「同步」
  }catch(e){
    console.error("保存失败",e);
    try{closeEdit();}catch(_){}
    toast("保存失败："+(e&&e.message?e.message:e));
  }
}
function removeRec(table,id){
  const k=keyOf(table,id);
  const rec=getMerged(table).find(r=>r.id===id);
  const name=rec?rec.name:("记录"+id);
  if(!edits.deleted.includes(k)) edits.deleted.push(k);
  // 若属手动新增，直接从 manual 移除
  edits.manual=edits.manual.filter(m=>!(m.table===table&&m.id===id));
  return name;
}
function delRec(table,id){
  if(!confirm("确定删除该记录？"))return;
  const name=removeRec(table,id);
  edits.log.push({key:keyOf(table,id)+"_"+Date.now(),table,recId:id,name,ts:Date.now(),op:"delete"});
  trimLog();
  persist();
  if(table==="laws")renderLaws();else renderStandards();
  renderBatchBar(table); renderChangePreview();
  toast("已删除，请点击顶部「同步」上传云端");
}
function persist(){
  saveLS(LS_OVR,edits.overrides); saveLS(LS_DEL,edits.deleted); saveLS(LS_MAN,edits.manual); saveLS(LS_LOG,edits.log);
  needSync=true; saveLS(LS_NEEDSYNC,"1"); updateSyncUI();   // 任何本地修改 → 标记未同步
}
function trimLog(){ if(edits.log.length>200) edits.log=edits.log.slice(-200); }
function fmtTime(ts){ if(!ts)return"-"; const d=new Date(ts); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
// （同步状态改用 dirty 标志判断，见 persist() 与 updateSyncUI()）
// 同步状态显示：有未同步改动→橙点"未同步(待同步)"；已同步→绿点"已同步 时间"；否则灰点"本地"
function updateSyncUI(){
  const dot=$("#syncDot"), txt=$("#syncText");
  if(needSync){ dot.className="dot dirty"; txt.textContent="未同步(待同步)"; return; }
  // 已同步状态稳定显示，临时连不上仅附加小提示，绝不翻回“本地”
  if(syncedTs){ dot.className="dot synced"; txt.textContent="已同步 "+fmtTime(syncedTs)+(cloudOk?"":"（云端暂不可达）"); return; }
  dot.className="dot"; txt.textContent="本地"+(cloudOk?"":"（云端不可用）");
}
function goToTop(){
  // 多方式兜底：不同浏览器/内核对滚动容器的判定不一致，全部试一遍
  try{ (document.scrollingElement||document.documentElement||document.body).scrollTo(0,0); }catch(e){}
  try{ window.scrollTo(0,0); }catch(e){}
  try{ document.documentElement.scrollTop=0; }catch(e){}
  try{ document.body.scrollTop=0; }catch(e){}
}
function fieldDiff(oldR,newR,table){
  const fields=table==="laws"
    ?[["name","法规名称"],["docNumber","发文字号"],["dept","发布部门"],["effectiveDate","实施日期"],["abolishDate","废止日期"],["status","状态"],["domains","所属领域"],["link","原文链接"],["remark","备注"]]
    :[["name","标准名称"],["stdNo","标准编号"],["publisher","发布单位"],["effectiveDate","实施日期"],["abolishDate","废止日期"],["status","状态"],["stdType","标准类型"],["link","原文链接"],["remark","备注"]];
  const diff=[];
  for(const [f,label] of fields){
    const o=Array.isArray(oldR[f])?oldR[f].join("/"):(oldR[f]||"");
    const n=Array.isArray(newR[f])?newR[f].join("/"):(newR[f]||"");
    if(o!==n) diff.push({f:label,old:o,new:n});
  }
  return diff;
}

/* ---------- 云端协同（best-effort） ---------- */
async function loadCloud(){
  // 读取走腾讯云 SCF 函数接口（实时读 GitHub，无 CDN 缓存，国内100%可达）；写才走 SCF 代理(POST)
  try{
    const r=await fetch(SYNC_PROXY+"/user-edits.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok){ updateSyncUI(); return; }
    let c=await r.json();
    // SCF 的 GET 返回 GitHub API 格式(content 为 base64 编码的原 JSON)，需解码
    if(c && c.content){ const bin=atob(c.content.replace(/\s/g,'')); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); c=JSON.parse(new TextDecoder('utf-8').decode(bytes)); }
    const ts=c.ts||0;
    // 兼容：旧版云端文件(带 version/changeLog，无 ts)结构与现版不同，直接合并会污染数据，故跳过
    if(!c.ts && c.version){ updateSyncUI(); return; }
    // 覆盖：取较新
    for(const k in (c.overrides||{})){ if(!edits.overrides[k]||ts> (edits._ts||0)) edits.overrides[k]=c.overrides[k]; }
    edits.deleted=[...new Set([...edits.deleted,...(c.deleted||[])])];
    for(const m of (c.manual||[])){ const ex=edits.manual.find(x=>x.table===m.table&&x.id===m.id); if(ex){ if((m.ts||0)>=(ex.ts||0)) Object.assign(ex,m); } else edits.manual.push(m); }
    // 云端变更记录同样过滤旧格式残留
    for(const e of (c.log||[])){ if(e&&e.op&&e.name&&e.ts&&!edits.log.some(x=>x.key===e.key)) edits.log.push(e); }
    edits._ts=ts;
    cloudOk=true; if(!needSync) syncedTs=Date.now(); updateSyncUI();
  }catch(e){     updateSyncUI(); }
}
// 只拉不推：从 SCF 函数接口实时合并同事修改（读 GitHub 无缓存），不调用 SCF 写回，避免误覆盖他人数据且不产生费用
async function cloudPull(){
  if(!edits)return;
  if(document.visibilityState!=="visible")return; // 仅页面可见时拉取，省资源
  const sig=JSON.stringify({m:edits.manual,o:edits.overrides,d:edits.deleted,l:edits.log});
  await loadCloud();
  const sig2=JSON.stringify({m:edits.manual,o:edits.overrides,d:edits.deleted,l:edits.log});
  if(sig!==sig2){ renderLaws(); renderStandards(); renderChangePreview(); } // 仅变化时重渲染，避免闪烁
}
async function pushCloud(){
  if(!SYNC_PROXY)return "未配置同步地址";
  try{
    const body={overrides:edits.overrides,deleted:edits.deleted,manual:edits.manual,log:edits.log,ts:Date.now()};
    const r=await fetch(SYNC_PROXY+"/user-edits.json",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.ok){ needSync=false; saveLS(LS_NEEDSYNC,"0"); syncedTs=Date.now(); updateSyncUI(); return true; }
    // 非成功：把服务端返回的错误信息带出来，便于前端如实提示（不再假成功）
    let msg="同步失败(HTTP "+r.status+")";
    try{ const j=await r.json(); if(j&&j.message)msg=j.message; }catch(e){}
    return msg;
  }catch(e){ return "网络错误："+e.message; }
}

/* ---------- 同步 / 自动检索 动画 ---------- */
function setBtn(btn,st){
  if(!btn)return;
  const ico=btn.querySelector(".ico");
  btn.classList.remove("loading","ok","err"); btn.disabled=false;
  if(st==="loading"){ btn.classList.add("loading"); btn.disabled=true; }
  else if(st==="ok"){ btn.classList.add("ok"); if(ico)ico.textContent="✓"; }
  else if(st==="err"){ btn.classList.add("err"); if(ico)ico.textContent="✗"; }
  else { if(ico)ico.textContent=""; }
}
async function manualSync(){
  const btn=document.getElementById("syncBtn");
  setBtn(btn,"loading");
  try{
    const res=await pushCloud();
    await loadCloud();
    if(res===true){ setBtn(btn,"ok"); toast("已同步云端"); }
    else { setBtn(btn,"err"); toast(typeof res==="string"?res:"同步失败"); }
  }catch(e){ setBtn(btn,"err"); toast("同步失败"); }
  finally{ setTimeout(()=>setBtn(btn,"idle"),1500); }
}
async function triggerRetrieve(){
  const btn=document.getElementById('retrieveBtn');
  const lbl=btn.querySelector('.btn-label');
  const st=$("#retrieveStatus");
  const setSt=(cls,txt)=>{ st.className='cc-status'+(cls?' '+cls:''); st.textContent=txt||''; };
  const startedAt=Date.now();
  const fmtElapsed=()=>{ const s=Math.floor((Date.now()-startedAt)/1000); return s<60?`${s} 秒`:`${Math.floor(s/60)} 分 ${s%60} 秒`; };
  setBtn(btn,'loading'); if(lbl)lbl.textContent='检索中…';
  try{
    const r=await fetch(SYNC_PROXY+'/trigger-update',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){
      btn.classList.remove('running'); btn.disabled=false; if(lbl)lbl.textContent='自动检索';
      setBtn(btn,'err');
      setSt('err','启动失败：'+(j.message||'请稍后再试'));
      setTimeout(()=>setBtn(btn,'idle'),1500);
      return;
    }
    // 启动成功：进入"检索中"常驻状态（按钮转圈+状态行实时提示）
    btn.classList.remove('loading'); btn.classList.add('running'); btn.disabled=true; if(lbl)lbl.textContent='检索中…';
    setSt('running',(j.message||'检索任务已启动，正在后台运行…'));
    const runId=j.run_id||'';
    let n=0; const MAX=12; const IV=25000;
    const timer=setInterval(async()=>{
      n++;
      try{
        const s=await fetch(SYNC_PROXY+'/check-status?run_id='+encodeURIComponent(runId)+'&t='+Date.now(),{cache:'no-store'});
        const sj=await s.json().catch(()=>({}));
        if(sj.runStatus==='completed'){
          clearInterval(timer);
          btn.classList.remove('running','loading'); btn.disabled=false; if(lbl)lbl.textContent='自动检索';
          if(sj.runConclusion==='success'){
            // 草稿模式：检索只产出提案，不会改动清单；这里拉取提案供逐条确认
            setSt('ok','✅ 检索完成，正在拉取待确认更新…');
            let n=await loadProposals();
            if(n) setSt('ok','✅ 检索完成：产出 '+n+' 条待确认更新，请在下方『待确认更新』逐条核对后勾选应用');
            else setSt('ok','✅ 检索完成：暂未取到提案（页面同步约需 1 分钟，稍后会自动重试）');
            // Pages 重建有延迟，延时再取一次
            setTimeout(async()=>{
              const m=await loadProposals();
              if(m&&!n) setSt('ok','✅ 检索完成：产出 '+m+' 条待确认更新，请在下方逐条核对后勾选应用');
              else if(!m&&!n) setSt('ok','✅ 检索完成：本次无需变更（无提案）');
            },30000);
            renderChangePreview();
          }else{
            setSt('err','⚠️ 本次检索未成功（'+(sj.runConclusion||'未知')+'），请查看 Actions 日志');
          }
          return;
        }
      }catch(e){}
      if(n>=MAX){
        clearInterval(timer);
        btn.classList.remove('running','loading'); btn.disabled=false; if(lbl)lbl.textContent='自动检索';
        setSt('running','⏳ 任务仍在后台运行（已等待约 '+fmtElapsed()+'），完成后『最近变更』会自动更新，您也可稍后刷新页面查看');
      }else{
        setSt('running','🔄 检索进行中…（已等待约 '+fmtElapsed()+'）');
      }
    },IV);
  }catch(e){
    btn.classList.remove('running'); btn.disabled=false; if(lbl)lbl.textContent='自动检索';
    setBtn(btn,'err');
    setSt('err','启动失败：'+e.message);
    setTimeout(()=>setBtn(btn,'idle'),1500);
  }
}

/* ---------- 待确认更新（自动检索提案闸门） ---------- */
let PROPOSALS=null;
const PROP_TYPE={add:"新增",update:"更新",abolish:"废止",status_switch:"状态切换"};
async function loadProposals(){
  const card=document.getElementById("proposalCard"); if(!card)return 0;
  let p=null;
  try{ const r=await fetch("proposed-changes.json?t="+Date.now(),{cache:"no-store"}); if(r.ok)p=await r.json(); }catch(e){}
  const nOk=(p&&Array.isArray(p.changes))?p.changes.length:0;
  const nRj=(p&&Array.isArray(p.rejected))?p.rejected.length:0;
  // 只要「可应用」或「待核实」任一非空就展示面板
  PROPOSALS=(nOk||nRj)?p:null;
  if(!PROPOSALS){ card.style.display="none"; return 0; }
  if(!Array.isArray(PROPOSALS.changes))PROPOSALS.changes=[];
  if(!Array.isArray(PROPOSALS.rejected))PROPOSALS.rejected=[];
  card.style.display="";
  renderProposals();
  return nOk;
}
function propSummaryLine(c){
  // 新增条目没有 diffs，改为展示新记录的关键字段，便于核对
  const r=c.newRecord||{};
  const f=[];
  if(r.stdNo)f.push("标准号 "+r.stdNo);
  if(r.docNumber)f.push("文号 "+r.docNumber);
  if(r.dept||r.publisher)f.push("发布 "+(r.dept||r.publisher));
  if(r.effectiveDate)f.push("实施日期 "+r.effectiveDate);
  if(r.status)f.push("状态 "+r.status);
  if(r.remark)f.push("备注 "+r.remark);
  return f.length?('<ul class="prop-diff">'+f.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"):"";
}
// 核准时清空明显的编造链接（防御：即便后端漏拦，也不把假链接写进清单）
// 仅拦「一眼假」：非 http、openstd 无/假 hcno、占位符、示例域名；绝不误伤真实官方深链。
function hcnoLooksFake(h){
  if(!h||h.length!==32)return true;
  if(/^(.)\1+$/.test(h))return true;            // 全同字符
  if(/(.)\1{3,}/.test(h))return true;           // 含≥4连续相同字符
  const blocks={};                              // 8 位块重复≥3 次（如 FFB7A8B3 重复）
  for(let i=0;i+8<=h.length;i+=8){const b=h.substr(i,8);blocks[b]=(blocks[b]||0)+1;}
  for(const k in blocks){ if(k && blocks[k]>=3) return true; }
  return false;
}
function clearFakeLink(rec){
  if(!rec||typeof rec!=="object")return;
  const lk=(rec.link||"").trim();
  if(!lk)return;
  let fake=false;
  if(!/^https?:\/\//i.test(lk)) fake=true;
  else if(lk.indexOf("openstd.samr.gov.cn")>=0){
    const m=lk.match(/hcno=([0-9A-Fa-f]+)/i);
    if(hcnoLooksFake(m?m[1]:"")) fake=true;
  }
  if(/YYYY|example\.com|占位|placeholder|test\./i.test(lk)) fake=true;
  if(fake){
    rec.link="";
    const old=(rec.remark||"").trim();
    rec.remark = old.indexOf("官方链接待补")<0
      ? (old?old+"（官方链接待补，系统自动清空编造链接）":"（官方链接待补）")
      : old;
  }
}
function renderProposals(){
  const box=document.getElementById("propList"); if(!box||!PROPOSALS)return;
  box.innerHTML=PROPOSALS.changes.map((c,i)=>{
    const d=c.display||{};
    const tbl=c.table==="standards"?"标准":"法规";
    const diffs=(d.diffs||[]).map(x=>'<li>'+esc(x.field)+'：<span class="old">'+(esc(x.from)||"（空）")+'</span> → <span class="new">'+(esc(x.to)||"（空）")+'</span></li>').join("");
    const body=diffs?('<ul class="prop-diff">'+diffs+"</ul>"):propSummaryLine(c);
    const reason=d.reason?'<div class="prop-sub">理由：'+esc(d.reason)+"</div>":"";
    const lk=d.link||(c.newRecord&&c.newRecord.link)||"";
    const link=lk?'<div class="prop-sub">原文链接：<a href="'+esc(lk)+'" target="_blank" rel="noopener">'+esc(lk)+"</a></div>":'<div class="prop-sub">原文链接：<span class="old">无</span></div>';
    const src=(d.source||d.sourceUrl)?('<div class="prop-sub">依据：'+esc(d.source||"")+(d.sourceUrl?' <a href="'+esc(d.sourceUrl)+'" target="_blank" rel="noopener">'+esc(d.sourceUrl)+"</a>":"")+"</div>"):'<div class="prop-sub">依据：<span class="old">未提供来源</span></div>';
    return '<div class="prop-item"><input type="checkbox" data-i="'+i+'" onchange="updatePropCount()"><div class="prop-main">'
      +'<div class="prop-title"><span class="pt '+esc(c.type)+'">'+(PROP_TYPE[c.type]||esc(c.type))+"</span>["+tbl+"] 《"+esc(c.name)+"》 <span class=\"muted\">"+esc(c.category||"")+"</span></div>"
      +body+reason+link+src+"</div></div>";
  }).join("")||'<div class="prop-empty">本次没有通过质检的可应用条目。</div>';
  renderRejected();
  updatePropCount();
}
// 未通过质检的线索：只展示不勾选，用来看清 GLM 到底错在哪，便于迭代提示词
function renderRejected(){
  const box=document.getElementById("propRejectList"); if(!box)return;
  const list=(PROPOSALS&&Array.isArray(PROPOSALS.rejected))?PROPOSALS.rejected:[];
  if(!list.length){ box.innerHTML='<div class="prop-empty">本次没有被拦下的线索。</div>'; return; }
  box.innerHTML=list.map(r=>{
    const tbl=r.table==="standards"?"标准":"法规";
    const act={add:"想新增",update:"想更新",abolish:"想废止"}[r.action]||esc(r.action||"");
    const reasons=(r.reasons||[]).map(x=>"<li>"+esc(x)+"</li>").join("");
    const su=r.sourceUrl?'<div class="prop-sub">它给的依据：<a href="'+esc(r.sourceUrl)+'" target="_blank" rel="noopener">'+esc(r.sourceUrl)+"</a></div>":'<div class="prop-sub">它给的依据：<span class="old">未提供</span></div>';
    const note=r.note?'<div class="prop-sub">它的说法：'+esc(r.note)+"</div>":"";
    return '<div class="prop-item"><div class="prop-main">'
      +'<div class="prop-title"><span class="pt reject">未通过</span>['+tbl+'] 《'+esc(r.name||"")+'》 <span class="muted">'+esc(r.category||"")+"　"+act+"</span></div>"
      +'<ul class="rj-reason">'+reasons+"</ul>"+note+su+"</div></div>";
  }).join("");
}
function updatePropCount(){
  const boxes=[...document.querySelectorAll("#propList input[type=checkbox]")];
  const n=boxes.filter(x=>x.checked).length;
  const nRj=(PROPOSALS&&Array.isArray(PROPOSALS.rejected))?PROPOSALS.rejected.length:0;
  const el=document.getElementById("propCount");
  if(el)el.textContent="（可应用 "+boxes.length+" 条／待核实 "+nRj+" 条"+(PROPOSALS&&PROPOSALS.generatedAt?("，检索于 "+PROPOSALS.generatedAt):"")+"）";
  const l=document.getElementById("propCountL");
  if(l)l.textContent="共 "+boxes.length+" 条，已选 "+n+" 条";
  const rr=document.getElementById("propCountR");
  if(rr)rr.textContent="共 "+nRj+" 条（不会写入清单）";
}
function toggleAllProposals(checked){
  document.querySelectorAll("#propList input[type=checkbox]").forEach(x=>{x.checked=!!checked;});
  updatePropCount();
}
function setPropSt(cls,txt){ const s=document.getElementById("propStatus"); if(!s)return; s.className="cc-status"+(cls?" "+cls:""); s.textContent=txt||""; }
async function applyProposals(){
  if(!PROPOSALS)return;
  const picks=[...document.querySelectorAll("#propList input[type=checkbox]")].filter(x=>x.checked).map(x=>PROPOSALS.changes[+x.dataset.i]).filter(Boolean);
  if(!picks.length){ toast("请先勾选要应用的条目"); return; }
  if(!confirm("确认把选中的 "+picks.length+" 条更新写入清单？未勾选的条目不会写入。")) return;
  const btn=document.getElementById("propApplyBtn"); if(btn)btn.disabled=true;
  setPropSt("running","正在写入…");
  const nd=JSON.parse(JSON.stringify(DATA));
  nd.laws=Array.isArray(nd.laws)?nd.laws:[]; nd.standards=Array.isArray(nd.standards)?nd.standards:[];
  const applied=[],skipped=[];
  for(const c of picks){
    const arr=c.table==="standards"?nd.standards:nd.laws;
    if(c.type==="add"){
      const rec=c.newRecord;
      if(!rec||!rec.name){ skipped.push(c.name+"（提案缺少记录内容）"); continue; }
      if(arr.some(r=>r.id===rec.id)||arr.some(r=>(r.name||"").trim()===(rec.name||"").trim())){ skipped.push(c.name+"（清单中已存在同名条目）"); continue; }
      clearFakeLink(rec);   // 核准时清空 GLM 给的编造链接（防御兜底）
      arr.push(rec);
    }else{
      if(!c.targetId||!c.setFields){ skipped.push(c.name+"（提案缺少目标或字段）"); continue; }
      const rec=arr.find(r=>r.id===c.targetId);
      if(!rec){ skipped.push(c.name+"（找不到对应条目）"); continue; }
      Object.assign(rec,c.setFields);
      clearFakeLink(rec);   // 核准时清空编造链接（防御兜底）
    }
    applied.push(c);
  }
  if(!applied.length){ if(btn)btn.disabled=false; setPropSt("err","没有可应用的条目："+skipped.join("；")); return; }
  const today=new Date().toISOString().slice(0,10);
  nd.lastUpdated=today;
  const remaining=PROPOSALS.changes.filter(c=>applied.indexOf(c)<0);
  const cnt=(t)=>applied.filter(c=>c.type===t).length;
  const summary={updatedAt:today,hasUpdates:true,
    counts:{added:cnt("add"),updated:cnt("update"),abolished:cnt("abolish"),statusSwitched:cnt("status_switch")},
    changes:applied.map(c=>{
      const d=c.display||{};
      const detail=(d.diffs&&d.diffs.length)?d.diffs.map(x=>x.field+" "+(x.from||"空")+"→"+(x.to||"空")).join("；"):(d.reason||"");
      return {type:c.type,name:c.name,category:c.category||"",detail:detail};
    })};
  try{
    const r=await fetch(SYNC_PROXY+"/apply-proposed",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({data:nd,summary:summary,remaining:remaining,
        rejected:(PROPOSALS.rejected||[]),generatedAt:PROPOSALS.generatedAt||today})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ if(btn)btn.disabled=false; setPropSt("err","写入失败："+(j.message||"请稍后再试")); return; }
    DATA=nd;
    $("#lastUpdated").textContent=DATA.lastUpdated||"-";
    buildFilterOptions(); renderLaws(); renderStandards();
    const keepRj=PROPOSALS.rejected||[];
    PROPOSALS=(remaining.length||keepRj.length)?Object.assign({},PROPOSALS,{changes:remaining,rejected:keepRj}):null;
    if(PROPOSALS){ renderProposals(); }
    else { const card=document.getElementById("proposalCard"); if(card)card.style.display="none"; }
    setPropSt("ok","✅ 已应用 "+applied.length+" 条"+(skipped.length?("，跳过 "+skipped.length+" 条："+skipped.join("；")):"")+"。约 1 分钟后线上同步生效。");
    toast("已应用 "+applied.length+" 条更新");
    renderChangePreview();
  }catch(e){ setPropSt("err","写入失败："+e.message+"。请勿重复点击，先刷新页面确认是否已生效。"); }
  finally{ if(btn)btn.disabled=false; }
}
// 直连 GitHub 公共接口核对文件是否真的已被删除（不需要令牌，且不受 Pages 缓存延迟影响）
async function proposalFileGone(){
  try{
    const r=await fetch("https://api.github.com/repos/haideweili1/laws-list/contents/proposed-changes.json?t="+Date.now(),{cache:"no-store"});
    return r.status===404;
  }catch(e){ return false; }
}
function closeProposalCard(msg){
  PROPOSALS=null;
  const card=document.getElementById("proposalCard"); if(card)card.style.display="none";
  if(msg)toast(msg);
}
async function discardProposals(){
  if(!PROPOSALS)return;
  const total=(PROPOSALS.changes||[]).length+(PROPOSALS.rejected||[]).length;
  if(!confirm("确认丢弃本次全部 "+total+" 条提案（含待核实线索）？清单数据不会有任何改动。")) return;
  const btn=document.getElementById("propDiscardBtn"); if(btn)btn.disabled=true;
  setPropSt("running","正在清理提案…");
  try{
    const r=await fetch(SYNC_PROXY+"/apply-proposed",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({discardOnly:true})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ setPropSt("err","清理失败："+(j.message||"请稍后再试")); return; }
    closeProposalCard("已丢弃本次提案");
    setPropSt("ok","✅ 已丢弃本次提案，清单数据未改动。");
  }catch(e){
    // 自愈：云函数可能已执行完但响应超时（旧版就是这样报 Failed to fetch 的）。
    // 直接问 GitHub 文件还在不在，在就是真失败，不在就是已经成功了。
    setPropSt("running","响应超时，正在核对后台是否已清理…");
    if(await proposalFileGone()){
      closeProposalCard("已丢弃本次提案");
      setPropSt("ok","✅ 后台已清理完成（前端响应超时，已自动核对）。清单数据未改动。");
    }else{
      setPropSt("err","清理失败："+e.message+"。请稍等 10 秒后再点一次『全部忽略』。");
    }
  }
  finally{ if(btn)btn.disabled=false; }
}

/* ---------- 变更记录（手动+自动合并） ---------- */
async function renderChangePreview(){
  const box=$("#changePreview");
  const manual=edits.log.slice().sort((a,b)=>b.ts-a.ts);
  let auto=null;
  try{ auto=await fetch("update-summary.json?t="+Date.now()).then(r=>r.ok?r.json():null); }catch(e){}
  const entries=[];
  manual.forEach(e=>entries.push({kind:"手动",ts:e.ts,e}));
  if(auto&&(auto.hasUpdates||(auto.changes&&auto.changes.length)||auto.updatedAt))
    entries.push({kind:"自动",ts:auto.updatedAt?new Date(auto.updatedAt).getTime():0,e:auto});
  entries.sort((a,b)=>b.ts-a.ts);
  if(!entries.length){ box.innerHTML='<span class="muted">暂无变更记录</span>'; return; }
  box.innerHTML=entries.slice(0,5).map(en=>{
    const tag=en.kind==="手动"?'<span class="ct manual">手动</span>':'<span class="ct auto">自动</span>';
    const t=en.kind==="手动"?fmtTime(en.ts):(en.e.updatedAt||"-"); let sum="";
    if(en.kind==="手动"){ const e=en.e;
      if(e.op==="add")sum="新增《"+esc(e.name)+"》";
      else if(e.op==="delete")sum="删除《"+esc(e.name)+"》";
      else sum="修改《"+esc(e.name)+"》"+(e.diff&&e.diff.length?("："+e.diff.slice(0,2).map(d=>d.f+" "+d.old+"→"+d.new).join("，")):"");
    } else {
      const a=en.e; const cs=(a.changes||[]).slice(0,5);
      if(!cs.length){ const c=a.counts||{}; sum="更新：新增"+(c.added||0)+" 修改"+(c.updated||0)+" 废止"+(c.abolished||0); }
      else sum=cs.map(ch=>{
        const ic=ch.type==="add"?"➕":ch.type==="abolish"?"🗑":ch.type==="status_switch"?"🔄":"✏";
        return ic+"《"+esc(ch.name)+"》"+(ch.detail?("："+esc(ch.detail)):"");
      }).join("；");
    }
    return '<div class="cri">'+tag+'<span class="ct-time">'+t+'</span><span>'+sum+'</span></div>';
  }).join("");
}
async function openChangelog(){
  $("#clogMask").style.display="flex";
  const box=$("#clogBody"); box.innerHTML="<p>加载中…</p>";
  const manual=edits.log.slice().sort((a,b)=>b.ts-a.ts);
  let auto=null;
  try{ auto=await fetch("update-summary.json?t="+Date.now()).then(r=>r.ok?r.json():null); }catch(e){}
  let h='<h4>手动变更（'+manual.length+'）</h4>';
  if(!manual.length) h+='<p class="muted">暂无手动变更</p>';
  else h+=manual.map(e=>{
    let body;
    if(e.op==="add") body='<p>➕ 新增《'+esc(e.name)+'》</p>';
    else if(e.op==="delete") body='<p>🗑 删除《'+esc(e.name)+'》</p>';
    else body='<p>✏ 修改《'+esc(e.name)+'》</p>'+(e.diff&&e.diff.length?'<ul>'+e.diff.map(d=>'<li>'+d.f+'：<span class="old">'+(esc(d.old)||'（空）')+'</span> → <span class="new">'+(esc(d.new)||'（空）')+'</span></li>').join("")+'</ul>':"");
    return '<div class="cl-entry"><div class="cl-meta">'+fmtTime(e.ts)+'</div>'+body+'</div>';
  }).join("");
  h+='<h4>自动更新</h4>';
  if(!auto) h+='<p class="muted">暂无自动更新记录</p>';
  else{
    h+='<p>运行时间：'+esc(auto.updatedAt||"-")+(auto.hasUpdates?"（有更新）":"（无变更）")+'</p>';
    const ch=(auto.changes||[]);
    if(!ch.length) h+='<p class="muted">本次无具体变更项</p>';
    else h+=ch.map(x=>{
      const ic=x.type==="add"?"➕":x.type==="abolish"?"🗑":x.type==="status_switch"?"🔄":"✏";
      return '<div class="cl-entry"><div class="cl-meta">'+(esc(x.category||"")||"")+'</div><p>'+ic+' 《'+esc(x.name)+'》'+(x.detail?(' — '+esc(x.detail)):"")+'</p></div>';
    }).join("");
  }
  box.innerHTML=h;
}
function closeChangelog(){ $("#clogMask").style.display="none"; }

/* ---------- 批量编辑 ---------- */
function onRowCheck(cb){ const k=cb.dataset.k; if(cb.checked)selected.add(k); else selected.delete(k); renderBatchBar(state.top); }
function toggleSelAll(table,checked){
  document.querySelectorAll("#"+(table==="laws"?"lawTable":"stdTable")+" tbody .sel").forEach(cb=>{ cb.checked=checked; if(checked)selected.add(cb.dataset.k); else selected.delete(cb.dataset.k); });
  renderBatchBar(table);
}
function renderBatchBar(table){
  const bar=$("#batchBar-"+table); if(!bar)return;
  const n=[...selected].filter(k=>k.startsWith(table+"::")).length;
  if(n>0){ bar.classList.remove("hidden"); $("#batchInfo-"+table).textContent="已选 "+n+" 条"; }
  else bar.classList.add("hidden");
}
function batchDelete(table){
  const keys=[...selected].filter(k=>k.startsWith(table+"::"));
  if(!keys.length)return;
  if(!confirm("确定批量删除选中的 "+keys.length+" 条记录？"))return;
  for(const k of keys){ const id=k.slice((table+"::").length); const name=removeRec(table,id); edits.log.push({key:k+"_"+Date.now(),table,recId:id,name,ts:Date.now(),op:"delete"}); selected.delete(k); }
  trimLog(); persist();
  if(table==="laws")renderLaws();else renderStandards();
  renderBatchBar(table); renderChangePreview();
  toast("已删除 "+keys.length+" 条，请点击顶部「同步」上传云端");
}

/* ---------- 批量改状态 / 批量设领域 ---------- */
let batchTable=null;
function openBatchStatus(table){
  const keys=[...selected].filter(k=>k.startsWith(table+"::"));
  if(!keys.length){toast("请先勾选要操作的记录");return;}
  batchTable=table;
  $("#batchStatusInfo").textContent="将选中的 "+keys.length+" 条记录统一设置为：";
  $("#batchStatusMask").style.display="flex";
}
function closeBatchStatus(){ $("#batchStatusMask").style.display="none"; }
function applyBatchStatus(){
  const table=batchTable; const ns=$("#bStatus").value;
  const keys=[...selected].filter(k=>k.startsWith(table+"::"));
  if(!keys.length)return;
  for(const k of keys){
    const id=k.slice((table+"::").length);
    const rec=getMerged(table).find(r=>r.id===id); if(!rec)continue;
    const oldStatus=rec.status||""; if(oldStatus===ns)continue;
    if(edits.manual.some(m=>m.table===table&&m.id===id)){const m=edits.manual.find(x=>x.table===table&&m.id===id);m.status=ns;}
    else edits.overrides[k]={...(edits.overrides[k]||rec),status:ns};
    edits.log.push({key:k+"_"+Date.now(),table,recId:id,name:rec.name,ts:Date.now(),op:"edit",diff:[{f:"状态",old:oldStatus,new:ns}]});
  }
  trimLog(); persist();
  if(table==="laws")renderLaws();else renderStandards();
  renderBatchBar(table); renderChangePreview();
  closeBatchStatus(); toast("状态已更新，请点击顶部「同步」上传云端");
}
function openBatchDomain(table){
  const keys=[...selected].filter(k=>k.startsWith(table+"::"));
  if(!keys.length){toast("请先勾选要操作的记录");return;}
  batchTable=table;
  $("#batchDomainInfo").textContent="将选中的 "+keys.length+" 条记录所属领域设置为（会替换原领域）：";
  $("#batchDomainMask").style.display="flex";
}
function closeBatchDomain(){ $("#batchDomainMask").style.display="none"; }
function applyBatchDomain(){
  const table=batchTable;
  const dom=$("#bDomain").value.split(",").map(s=>s.trim()).filter(Boolean);
  const keys=[...selected].filter(k=>k.startsWith(table+"::"));
  if(!keys.length)return;
  for(const k of keys){
    const id=k.slice((table+"::").length);
    const rec=getMerged(table).find(r=>r.id===id); if(!rec)continue;
    const oldDom=(rec.domains||[]).join("/"); const newDom=dom.join("/"); if(oldDom===newDom)continue;
    if(edits.manual.some(m=>m.table===table&&m.id===id)){const m=edits.manual.find(x=>x.table===table&&m.id===id);m.domains=dom;}
    else edits.overrides[k]={...(edits.overrides[k]||rec),domains:dom};
    edits.log.push({key:k+"_"+Date.now(),table,recId:id,name:rec.name,ts:Date.now(),op:"edit",diff:[{f:"所属领域",old:oldDom,new:newDom}]});
  }
  trimLog(); persist();
  renderLaws(); renderBatchBar(table); renderChangePreview();
  closeBatchDomain(); toast("所属领域已更新，请点击顶部「同步」上传云端");
}

/* ---------- 导出 ---------- */
function currentRows(table){return getMerged(table);}
function exportExcel(table){
  const rows=currentRows(table);
  const cols=table==="laws"
    ?[["法规名称","name"],["发布部门","dept"],["实施日期","effectiveDate"],["状态","status"],["所属领域","domains"],["原文链接","link"],["备注","remark"]]
    :[["标准编号","stdNo"],["标准名称","name"],["标准类型","stdType"],["发布单位","publisher"],["实施日期","effectiveDate"],["状态","status"],["原文链接","link"],["备注","remark"]];
  const head=["序号",...cols.map(c=>c[0])];
  const data=rows.map((r,i)=>[i+1,...cols.map(c=>Array.isArray(r[c[1]])?r[c[1]].join("/"):(r[c[1]]||""))]);
  const ws=XLSX.utils.aoa_to_sheet([head,...data]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,table==="laws"?"法律法规":"产品标准");
  XLSX.writeFile(wb,(table==="laws"?"法律法规":"产品标准")+"清单.xlsx");
}
function exportPDF(table){exportCanvas(table,true);}
function exportPNG(table){exportCanvas(table,false);}
function exportCanvas(table,asPdf){
  const el=table==="laws"?$("#lawTable"):$("#stdTable");
  html2canvas(el,{scale:2}).then(canvas=>{
    if(!asPdf){const a=document.createElement("a");a.download=(table==="laws"?"法律法规":"产品标准")+"清单.png";a.href=canvas.toDataURL("image/png");a.click();return;}
    const img=canvas.toDataURL("image/png");const p=new window.jspdf.jsPDF("l","mm","a4");
    const pw=p.internal.pageSize.getWidth(),ph=p.internal.pageSize.getHeight();
    const iw=pw, ih=canvas.height*ik(pw)/canvas.width; let y=0;
    function ik(w){return w/canvas.width;}
    let pos=0; const h=ih;
    // 简单分页
    let remaining=canvas.height, pageH=ph*canvas.width/pw;
    const pageCanvas=document.createElement("canvas");pageCanvas.width=canvas.width;
    const ctx=pageCanvas.getContext("2d");
    let sy=0;
    while(sy<canvas.height){
      const sh=Math.min(pageH,canvas.height-sy);
      pageCanvas.height=sh;
      ctx.drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
      const pImg=pageCanvas.toDataURL("image/png");
      if(sy>0)p.addPage();
      const dh=sh*ik(pw);
      p.addImage(pImg,"PNG",0,0,pw,dh);
      sy+=sh;
    }
    p.save((table==="laws"?"法律法规":"产品标准")+"清单.pdf");
  });
}
init();
